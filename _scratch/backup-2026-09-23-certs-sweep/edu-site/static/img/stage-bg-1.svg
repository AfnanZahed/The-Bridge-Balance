    <circle cx="380" cy="180" r="2"/>
    <circle cx="548" cy="300" r="2.5"/>
    <circle cx="780" cy="220" r="3"/>
    <circle cx="980" cy="160" r="2"/>
    <circle cx="1180" cy="280" r="2.5"/>
    <circle cx="1360" cy="200" r="3"/>
