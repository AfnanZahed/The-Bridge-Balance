concepts:

  - term: Spec-Driven Engineering
    status: defined
    canonical: >-
      The discipline in which the engineer specifies intent and boundaries, the
      AI implements within them, and a human verifies before taking ownership.
    first_defined: docs/intro-5-spec-driven-engineering.md
    used_in: [docs/intro-5-spec-driven-engineering.md, docs/welcome.md, docs/ch00-introduction.md]
    notes: >-
      Curriculum-coined. Must be defined once on first use in EVERY chapter
      that uses it, however late in the book - field expertise does not cover
      this project's own vocabulary.
      REMOVED 2026-09-10: docs/intro-spine-experiment.md (a lesson-spine-
      authoring pilot that additionally decomposed this name at Station 0 -
      spec + driven + engineering, verified against etymonline-spec-
      engineer-roots) was deleted after the pilot succeeded, ahead of
      applying the same treatment to intro.md itself. See
      prerequisite-graph.yaml's progress note.
      USED 2026-09-15 by docs/welcome.md, which now precedes intro-5 in reading
      order and glosses the term to the twelve-word limit ("write the intent and
      the limits down before code is generated") without carrying the canonical
      definition above. first_defined stays intro-5: Welcome glosses, it does not
      define properly.
      GLOSSED 2026-09-17 by docs/ch00-introduction.md, the new Stage 0 front
      door, which now sits ahead of everything else in the stage. It glosses to
      twelve words ("state what you want and what can't change, then check the
      result"), links the glossary anchor, and names Stage 0's last chapter as
      where the practice actually gets taught rather than teaching it here. Same
      pattern as Welcome again, so first_defined stays intro-5 and no second
      entry is created.
      RE-ALIGNED 2026-09-17 (full Name-First pass on ch00): the file as found
      carried only the four bare steps, unglossed and unlinked, while this
      note described the gloss, the anchor and the last-chapter pointer. The
      bullet was brought back into line with the note, so text and ledger
      agree again; the /glossary#spec-driven-engineering anchor was
      re-validated by check-references after the restore.

  - term: Development (vs. Engineering)
    status: defined
    canonical: >-
      Development is producing the implementation - the syntax, the working
      code. Engineering is the judgment around it: specify, bound, verify,
      and own. AI has made Development cheap; it has not made Engineering
      cheap. The reader's own stage is Engineering; AI's stage is wider, but
      it never owns Engineering's judgment.
    first_defined: curriculum-state/canon/thesis.md
    used_in: [docs/intro-5-spec-driven-engineering.md]
    notes: >-
      Canon-level distinction (added 2026-09-09), not chapter-coined -
      defined in canon/thesis.md itself since it must never drift, then made
      explicit in docs/intro-5-spec-driven-engineering.md. Maps onto the Specify/Design/Implement/
      Verify table intro.md already uses: Implement = Development; Specify,
      Design, Verify = Engineering. Gloss at first use per the usual rule
      even though these are common English words - in this book they carry a
      specific, capitalized, technical meaning that differs from generic use
      of "development." REMOVED 2026-09-10: docs/intro-spine-experiment.md
      (the other chapter that made this explicit) was deleted after its
      lesson-spine-authoring pilot succeeded - see prerequisite-graph.yaml.

  - term: vibe coding
    status: defined
    canonical: >-
      Building software entirely through iterative AI prompts without
      understanding the underlying code. Coined by Andrej Karpathy, February
      2025; Collins Dictionary Word of the Year 2025.
    first_defined: docs/intro-5-spec-driven-engineering.md
    used_in: [docs/intro-5-spec-driven-engineering.md]
    notes: Always attributed. Never presented as this project's own coinage.

  - term: agent
    status: defined
    canonical: >-
      A program that can read your files, write new code, edit existing code,
      and run commands on a computer — on its own, in a sequence, without
      asking you to approve every single step.
    registers:
      analogy: >-
        A very fast, very capable helper — not an architect, and not the owner
        of the result. It can read your files, write new code, edit what's
        already there, and run commands, all without you approving every
        single step.
      coding-agent: >-
        A program that reads your files, writes and edits code, and runs
        commands — in sequence, without asking you to approve each step.
    first_defined: docs/intro-5-spec-driven-engineering.md
    used_in: [docs/intro-1-binary-to-programming.md, docs/intro-5-spec-driven-engineering.md]
    notes: >-
      Canonical wording above is what shipped. Gloss it at first use in every
      chapter that uses it - no exceptions by stage.
      UPDATE 2026-09-10: intro-1 introduces the term as "coding agent" and
      glosses it inline, so a reader meets it before intro-5 defines it fully.
      The "coding-agent" register variant above is intro-1's shipped wording -
      the same concept, not a second entry.

  - term: specification (spec)
    status: defined
    canonical: >-
      A written statement of what you want built and what shouldn't change,
      agreed before you start.
    first_defined: docs/intro-5-spec-driven-engineering.md
    used_in: [docs/intro-5-spec-driven-engineering.md]
    notes: >-
      Glossed inline on
      first use ("Not a full specification — a written statement of what you
      want built and what shouldn't change, agreed before you start — just a
      plain sentence..."). Wording is a light simplification of the earlier
      framework-draft proposal, adapted to read naturally inline rather than as
      a standalone definition; substance is unchanged (intent + boundaries,
      agreed before implementation starts).

  - term: blast radius
    status: defined
    canonical: >-
      How much can break, and how far the damage reaches, if a change goes
      wrong.
    first_defined: docs/intro-5-spec-driven-engineering.md
    used_in: [docs/intro-5-spec-driven-engineering.md]
    notes: >-
      Introduced in the tool-calling worked example, glossed inline on first
      use ("the blast radius of an error ... how much can break, and how far
      the damage reaches"), then reused unglossed later in the same chapter
      ("every system's blast radius") - acceptable reuse once a term has been
      glossed once in that chapter. The intro also covers adjacent ground
      (the four-criteria experiment-to-system transition) in different
      vocabulary; that was deliberate, not an oversight.
      RESET 2026-09-17: Stage 1's six chapters were reverted to placeholder
      (owner instruction) and their re-glosses removed from used_in. This
      entry, and all Stage 1 reuse below, is preserved as a record only - the
      terms are no longer live on the site.

  - term: verification gate
    status: proposed
    canonical: >-
      The check a change must pass before a human accepts ownership of it.
    first_defined: null
    used_in: []
    notes: >-
      Not shipped anywhere yet. The concept it names is present throughout the
      intro ("verify before ownership transfers," the three-surface contract
      architecture) but never coined as this specific standalone term.
      Available for whichever future lesson names it first.

  - term: RAG (Retrieval-Augmented Generation)
    status: used-undefined
    canonical: null
    first_defined: null
    used_in: [docs/intro-5-spec-driven-engineering.md]
    notes: >-
      Stage 4 material appearing in the intro. Acceptable there
      (that reader has it). UPDATE 2026-08-24: the acronym is now expanded on
      first use, via the "Surface 1 — Retrieval-augmented generation" heading
      immediately preceding the first bare use of "RAG" - so the
      first-use-expansion requirement is now satisfied. Status stays
      used-undefined because no formal one-sentence canonical definition has
      shipped yet; that full definition is still Stage 4's job.

  # FIRST DEFINED 2026-09-10 by docs/intro-1-binary-to-programming.md, the real
  # spine treatment that succeeded the deleted intro-2 pilot. The pilot's terms
  # (previously recorded as "defined nowhere") are now live and canonical here.
  # Their canonical wording is the shipped prose of intro-1; reuse it verbatim.

  - term: program
    status: defined
    canonical: >-
      A written plan set down in advance for something else to follow. In
      computing, the set of instructions a machine carries out, with nothing
      left open to interpretation.
    first_defined: docs/intro-1-binary-to-programming.md
    used_in: [docs/intro-1-binary-to-programming.md]
    notes: >-
      From Greek programma (a written public notice), via Late Latin. The
      etymology is verified against Etymonline and Wiktionary
      (evidence-ledger: etymonline-program) and is the chapter's Station 0.
      Distinguish from "programme", the British spelling for a printed schedule.

  - term: programming
    status: defined
    canonical: >-
      Writing down a set of instructions precise enough that a machine with no
      judgement can carry them out. The written plan is the program;
      programming is the act of making that plan exact.
    first_defined: docs/intro-1-binary-to-programming.md
    used_in: [docs/intro-1-binary-to-programming.md]
    notes: >-
      Carries the chapter's problem statement: the reader's likely misconception
      is that programming means typing code quickly. The canonical wording is
      deliberately about precision, not production.

  - term: transistor
    status: defined
    canonical: "A tiny electrical switch with exactly two stable states: on or off."
    first_defined: docs/intro-1-binary-to-programming.md
    used_in: [docs/intro-1-binary-to-programming.md, docs/ch01-foundations.md]
    notes: >-
      REUSED by docs/ch01-foundations.md (new Stage 0 ladder, chapter 1).
      CORRECTED 2026-09-20: this note used to describe ch01 as re-glossing the
      term through Pierce's "transresistance" etymology. That passage was
      removed from ch01 on 17 September and the note was never updated - a
      later session could have read this as a description of the live chapter
      and put the naming story back. Verified 2026-09-20: "transresistance"
      appears zero times in ch01-foundations.md.
      The etymology is real and stays available in name-registers.md; it is not
      beginner material and does not belong in a Stage 0 chapter.
      CURRENT as of the 2026-09-20 rewrite: ch01 explains it as "a tiny piece
      of specially treated crystal" that does a relay's job with no moving
      parts and a tube's job without the heat. "Germanium" was removed as a
      word a beginner does not need (canon/corrections.md §12).
      intro-1 stays first_defined until the owner decides whether to retire the
      old intro sequence.

  - term: bit
    status: defined
    canonical: >-
      One switch's state, on or off; short for binary digit. The smallest unit
      of information a machine can hold.
    first_defined: docs/intro-1-binary-to-programming.md
    used_in: [docs/intro-1-binary-to-programming.md, docs/ch01-foundations.md]
    notes: >-
      REUSED by docs/ch01-foundations.md, which explains it inline and uses the
      2003 Belgian election bit-flip as a concrete illustration of what one
      flipped bit actually costs.
      CORRECTED 2026-09-20: this note used to say ch01 glosses the term "via
      Tukey's January 1947 memo". That attribution was removed from the chapter
      on 17 September. Verified 2026-09-20: "Tukey" appears zero times in
      ch01-foundations.md. The memo stays in evidence-ledger.yaml as backstage
      research.

  - term: byte
    status: defined
    canonical: "Eight bits grouped together, able to hold 256 distinct patterns."
    first_defined: docs/intro-1-binary-to-programming.md
    used_in: [docs/intro-1-binary-to-programming.md]

  - term: ASCII
    status: defined
    canonical: >-
      An agreed scheme giving every letter, digit, and punctuation mark on a
      keyboard its own byte pattern. First standardised as ASA X3.4-1963.
    first_defined: docs/intro-1-binary-to-programming.md
    used_in: [docs/intro-1-binary-to-programming.md]
    notes: >-
      The prose makes the agreement (not the pattern) the point. The 1963 date
      is not stated in the chapter body; it is recorded here from
      evidence-ledger: ascii-1963-standardisation.

  - term: machine code
    status: defined
    canonical: >-
      The raw binary a processor executes directly; the only language the
      processor reads natively.
    first_defined: docs/intro-1-binary-to-programming.md
    used_in: [docs/intro-1-binary-to-programming.md, docs/ch02-programming-is-born.md]
    notes: >-
      REUSED 2026-09-16 by docs/ch02-programming-is-born.md, the new Stage 0
      ladder's chapter 2, which re-glosses it through the pain of writing and
      reading numeric operation codes by hand rather than restating the
      definition above.

  - term: register (processor)
    status: defined
    canonical: "A small storage slot inside a processor holding a value it is working on."
    first_defined: docs/intro-1-binary-to-programming.md
    used_in: [docs/intro-1-binary-to-programming.md]

  - term: x86
    status: defined
    canonical: "The processor family used by Intel and AMD chips."
    first_defined: docs/intro-1-binary-to-programming.md
    used_in: [docs/intro-1-binary-to-programming.md]

  - term: ARM
    status: defined
    canonical: "The processor family used in most phones and in Apple's own chips."
    first_defined: docs/intro-1-binary-to-programming.md
    used_in: [docs/intro-1-binary-to-programming.md]

  - term: punched card
    status: defined
    canonical: >-
      A stiff paper card with holes at set positions, used to feed early
      computers one instruction pattern at a time.
    first_defined: docs/intro-1-binary-to-programming.md
    used_in: [docs/intro-1-binary-to-programming.md, docs/ch01-foundations.md]
    notes: >-
      REUSED by docs/ch01-foundations.md, which reaches further back than
      intro-1 did - the weaving loom and Babbage's design - rather than
      re-defining the term from scratch.
      CORRECTED 2026-09-20: this note used to list "Jacquard's loom (1801),
      Babbage's design (1837) and Hollerith's census tabulator (1890)" as what
      the chapter carries. The dates and Hollerith were removed on 17 September.
      Verified 2026-09-20: "Hollerith" appears zero times in ch01-foundations.md.
      All three remain in evidence-ledger.yaml as backstage research.

  - term: assembly language
    status: defined
    canonical: >-
      Short human-readable commands that map almost one-to-one onto a
      processor's machine instructions.
    first_defined: docs/intro-1-binary-to-programming.md
    used_in: [docs/intro-1-binary-to-programming.md, docs/ch02-programming-is-born.md]
    notes: >-
      First written, with its assembler, by Kathleen Booth and colleagues at
      Birkbeck College in the late 1940s (evidence-ledger:
      kathleen-booth-assembly-1947). That sourcing is backstage.
      REUSED by docs/ch02-programming-is-born.md, which names Booth and
      explains the term through the `ADD`/`LOAD`/`STORE` example.
      CORRECTED 2026-09-20: this note used to say ch02 "names Booth and the 1947
      date explicitly". The date was removed on 17 September; the name stayed.

  - term: assembler
    status: defined
    canonical: >-
      The program that translates assembly language into the machine code of
      one specific processor family.
    first_defined: docs/intro-1-binary-to-programming.md
    used_in: [docs/intro-1-binary-to-programming.md, docs/ch02-programming-is-born.md]

  - term: high-level language
    status: defined
    canonical: >-
      A programming language written to be read by people rather than machines,
      and not tied to one chip family.
    first_defined: docs/intro-1-binary-to-programming.md
    used_in: [docs/intro-1-binary-to-programming.md]

  - term: compiler
    status: defined
    canonical: >-
      A program that translates a whole program into machine code before any of
      it runs. C and Java work this way.
    first_defined: docs/intro-1-binary-to-programming.md
    used_in: [docs/intro-1-binary-to-programming.md, docs/ch02-programming-is-born.md]
    notes: >-
      The first was Grace Hopper's A-0 system, completed 1952
      (evidence-ledger: a0-system-hopper-compiler-nuance). That sourcing is
      backstage.
      REUSED by docs/ch02-programming-is-born.md, which explains the term
      through FORTRAN.
      CORRECTED 2026-09-20: this note used to say ch02 re-glosses "through
      FORTRAN (April 1957) specifically" and carries the A-0 loader caveat.
      Verified 2026-09-20: "A-0" appears zero times in ch02, and the month was
      removed from the FORTRAN date. The caveat remains correct and remains in
      evidence-ledger.yaml; it is not beginner prose.

  - term: interpreter
    status: defined
    canonical: >-
      A program that translates and runs source code line by line as it goes.
      Python and JavaScript work this way.
    first_defined: docs/intro-1-binary-to-programming.md
    used_in: [docs/intro-1-binary-to-programming.md]

  - term: abstraction
    status: defined
    canonical: >-
      Hiding one layer's complexity so the layer above it can be reasoned about
      without knowing what is underneath.
    first_defined: docs/intro-1-binary-to-programming.md
    used_in: [docs/intro-1-binary-to-programming.md]

  - term: framework
    status: defined
    canonical: "Pre-written code you build on instead of writing from scratch."
    first_defined: docs/intro-1-binary-to-programming.md
    used_in: [docs/intro-1-binary-to-programming.md]

  # ---------------------------------------------------------------------------
  # FIRST DEFINED 2026-09-10 by docs/intro-2-architecture-map.md, authored in
  # the Phase 2 parallel run (four chapters drafted by sub-agents, then
  # verified, gated and written back by the orchestrator). This chapter carries
  # the heaviest gloss load in the book - roughly forty first-use terms in one
  # causal chain - so the entries below are the chapter's whole vocabulary, in
  # the order the prose introduces it. Canonical wording is the shipped prose;
  # reuse it verbatim.
  # ---------------------------------------------------------------------------

  - term: platform
    status: defined
    canonical: "The environment a piece of software actually runs inside."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: browser
    status: defined
    canonical: "The program you open web pages in."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md, docs/intro-3-editors-and-ides.md]

  - term: HTML (HyperText Markup Language)
    status: defined
    canonical: "The layer that arranges the structure - this is a heading, this is a button, this is a list."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: CSS (Cascading Style Sheets)
    status: defined
    canonical: "The layer that decides how it looks - this button is blue, this list has space between its items."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: JavaScript
    status: defined
    canonical: "The layer that makes it respond - when this button is clicked, do this."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md, docs/intro-3-editors-and-ides.md]
    notes: >-
      Glossed here for its browser role. intro-3 relies on it without
      re-glossing, which is a defect to fix if intro-3 is revised - the
      per-chapter first-use rule applies.

  - term: frontend
    status: defined
    canonical: "The part of the software that runs on the user's own device and faces them."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md, docs/intro-5-spec-driven-engineering.md]
    notes: >-
      The chapter's Station 0 term, run on both halves of the name (front +
      end). The prediction it stages - that the rule belongs in the half
      facing the student - is scored in the "trap" section.

  - term: backend
    status: defined
    canonical: "The part of the software that runs on a machine you control, away from the user."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md, docs/intro-5-spec-driven-engineering.md]
    notes: >-
      Second half of the Station 0 pair. intro-5 re-glosses it inline
      ("the part of the system that enforces rules on a machine you control"),
      satisfying the per-chapter rule.

  - term: component
    status: defined
    canonical: "One reusable piece of interface, built once and used wherever it is needed."
    registers:
      architectural: "One part of the system that does a single job." 
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]
    notes: >-
      TWO SENSES, one word, recorded here rather than as a second entry per the
      one-definition rule. intro-2 uses the INTERFACE sense (a reusable piece
      of UI); a later architectural sense (any part of a system doing one job)
      was used by s1-01. A chapter using the word must disambiguate on first
      use.
      RESET 2026-09-17: s1-01 and s1-03 reverted to placeholder (owner
      instruction); removed from used_in. The two-senses note is kept for
      whichever chapter reuses the architectural sense next.

  - term: DOM (Document Object Model)
    status: defined
    canonical: "A live, in-memory model of the page, assembled by the browser from HTML, CSS and JavaScript."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: responsiveness
    status: defined
    canonical: "The interface reshaping itself correctly for whatever screen it lands on."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: breakpoint
    status: defined
    canonical: "A size threshold where the layout deliberately changes shape rather than only shrinking."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]
    notes: >-
      RESET 2026-09-17: s1-03 reverted to placeholder (owner instruction);
      removed from used_in. It had re-glossed this term ("a screen width where
      the layout deliberately changes shape") and added the mechanism the
      intro left standing - the media query underneath, Tailwind's five named
      defaults (640/768/1024/1280/1536 px), and that all of them are MINIMUMS.
      That material is no longer live; a future chapter re-teaching breakpoints
      should still cover the mobile-first MINIMUMS point.

  - term: Next.js
    status: used-undefined
    canonical: "The framework this curriculum builds the frontend with, made by Vercel."
    first_defined: null
    used_in: [docs/intro-2-architecture-map.md]
    notes: >-
      STAGED INTRODUCTION, incomplete again. intro-2 named it only,
      deliberately, saying "worth knowing the name now even though what it
      does belongs to its own chapter." s1-03 was that chapter and had moved
      this to status: defined.
      RESET 2026-09-17: s1-03 reverted to placeholder (owner instruction).
      status and first_defined reverted to used-undefined / null until a
      chapter defines it again. Version claims live in the evidence ledger
      (nextjs-2026) and expire on a 90-day clock - do not restate a version
      here.

  - term: client-side
    status: defined
    canonical: "Checks that run on the user's own device."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: server-side
    status: defined
    canonical: "Checks that run on a machine you control."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: client
    status: defined
    canonical: "The program making the request, seen from the server's side."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: never trust the client
    status: defined
    canonical: >-
      The frontend can never be trusted to enforce anything, because you do not
      control the device it runs on.
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]
    notes: >-
      The chapter's spine sentence and its signature contribution - every
      remaining box in the chapter exists as a consequence of it. Traced to
      Saltzer and Schroeder's 1975 "complete mediation" principle
      (evidence-ledger: saltzer-schroeder-1975).

  - term: developer tools
    status: defined
    canonical: "Panels, built for debugging, that let anyone inspect and edit the page's code live."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]
    notes: >-
      The mechanism that makes the trap concrete - right-click, Inspect, edit,
      delete the check. Cited by intro-5 as the reason a frontend rule is a
      decoration.

  - term: Node.js
    status: defined
    canonical: "A runtime that lets JavaScript, a language born for browsers, run outside one."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: server
    status: defined
    canonical: "An ordinary computer, always switched on and reachable, in a data centre or a provider's warehouse."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: statelessness
    status: defined
    canonical: "A backend keeping no memory between requests."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]
    notes: >-
      Introduced as a convenience ("what lets many copies of the same backend
      run at once"), then re-used as a problem in "the goldfish problem" - the
      chapter's deliberate two-pass structure.
      RESET 2026-09-17: s1-04 reverted to placeholder (owner instruction);
      removed from used_in.

  - term: API (Application Programming Interface)
    status: defined
    canonical: >-
      An agreed way for two programs to talk: a fixed set of questions one
      promises to answer, in a fixed shape.
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: HTTP (HyperText Transfer Protocol)
    status: defined
    canonical: "The language those requests travel in."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: method (HTTP)
    status: defined
    canonical: "The kind of thing being asked - GET reads, POST creates, PUT or PATCH changes, DELETE removes."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: status code
    status: defined
    canonical: "A number saying what happened - 200 success, 403 not allowed, 404 not found, 500 something broke."
