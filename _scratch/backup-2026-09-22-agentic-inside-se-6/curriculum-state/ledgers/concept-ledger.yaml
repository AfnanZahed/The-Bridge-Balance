  - term: binary
    status: defined
    canonical: >-
      A system built entirely from two states, on or off — the fewest states
      that still survive being sent down a long or noisy wire.
    first_defined: docs/ch01-foundations.md
    used_in: [docs/ch01-foundations.md]
    notes: >-
      From Latin bini, "two together" (evidence-ledger: etymonline-binary).
      Curiously, intro-1's title names "binary" but the concept-ledger shows no
      prior entry defining the word itself - only its consequences (bit, byte,
      transistor). This chapter is the first to define the word properly.

  - term: relay (electromechanical)
    status: defined
    canonical: >-
      A switch worked by an electromagnet pulling a metal contact open or
      shut - the first physical body the two-state switch idea wore.
    first_defined: docs/ch01-foundations.md
    used_in: [docs/ch01-foundations.md]

  - term: vacuum tube
    status: defined
    canonical: >-
      A switch made of glass and a controlled beam of electrons instead of
      metal contacts - faster than a relay, with nothing to wear down, but
      prone to burning out from its own heat.
    first_defined: docs/ch01-foundations.md
    used_in: [docs/ch01-foundations.md]

  - term: FORTRAN
    status: defined
    canonical: >-
      Short for Formula Translation - the first widely used high-level
      language, delivered by John Backus's team at IBM in 1957, letting
      a scientist write something close to ordinary algebra and have a
      compiler turn it into machine code automatically.
    first_defined: docs/ch02-programming-is-born.md
    used_in: [docs/ch02-programming-is-born.md]
    notes: >-
      Chapter 2 deliberately does not survey languages after FORTRAN - that is
      Chapter 3's ("One Language Was Never Enough") job per
      stage-0-drafting-plan.md. Do not extend this entry's canonical wording to
      cover later languages; add separate entries for those when that chapter
      drafts.
