      the feature exists for. Worth reusing that Station-0 decomposition
      whenever this chapter is re-authored.

  - term: merge conflict
    status: defined
    canonical: "When two branches change the same lines in incompatible ways, Git asks a human to decide which version wins. It will not guess."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]
    notes: >-
      RESET 2026-09-17: s1-06 reverted to placeholder (owner instruction);
      removed from used_in. It had re-glossed the term in three words ("Git
      declining to guess") and added the part the intro could not: the marker
      syntax a reader actually meets, and that resolving one is a normal step
      rather than an error.

  - term: deployment
    status: defined
    canonical: "Taking the frontend and the backend and putting them on machines that are always on and always reachable."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: DNS (Domain Name System)
    status: defined
    canonical: "The infrastructure that points a human-readable address at the machines running a site."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: domain
    status: defined
    canonical: "The human-readable address itself."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: production
    status: defined
    canonical: "The environment real users touch."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: staging (environment)
    status: defined
    canonical: "Where changes are tried first, so a mistake never lands in front of a real user."
