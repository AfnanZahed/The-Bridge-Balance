    canonical: "The part of an agent system that touches your machine, as distinct from the model that thinks."
    first_defined: docs/intro-4-terminals-and-cli-agents.md
    used_in: [docs/intro-4-terminals-and-cli-agents.md]
    notes: >-
      Load-bearing for the chapter's trust argument: "The harness is the part
      that touches your machine. That is the part you are deciding to trust."

  - term: scope (agent)
    status: defined
    canonical: "The set of places an agent is allowed to touch, set by the directory you launched it from."
    first_defined: docs/intro-4-terminals-and-cli-agents.md
    used_in: [docs/intro-4-terminals-and-cli-agents.md]
    notes: >-
      The chapter's central safety mechanism and the thing a permission prompt
      never asks about.

  - term: token (AI billing)
    status: defined
    canonical: "Chunks of text, roughly three quarters of a word in English, and the unit every language model is priced in."
    first_defined: docs/intro-4-terminals-and-cli-agents.md
    used_in: [docs/intro-4-terminals-and-cli-agents.md]
    notes: >-
      Distinct sense from the `token` entry above (an auth token). Same word,
      different meaning, different chapter - deliberately a second entry
      because the concept differs, not the register.

  # ---------------------------------------------------------------------------
  # FIRST DEFINED 2026-09-10 by docs/intro-5-spec-driven-engineering.md, whose
  # Phase 2 merge-and-rewrite drew the SDD-vs-SDE line by name for the first
  # time (previously left open - see prerequisite-graph.yaml's intro-5 notes).
  # ---------------------------------------------------------------------------

  - term: Spec-Driven Development (SDD)
    status: defined
    canonical: >-
      The current, tool-adopted workflow in which specifications, not prompts,
      govern what AI generates. Adopted by GitHub's Spec Kit, Amazon's Kiro and
      Anthropic's Claude Code from 2025, and formalised in a February 2026 paper.
    first_defined: docs/intro-5-spec-driven-engineering.md
    used_in: [docs/intro-5-spec-driven-engineering.md]
    notes: >-
      NOT this project's coinage and never to be presented as such. The chapter
      draws the line explicitly: SDD is the shorter sibling that came first, and
      Spec-Driven Engineering is its successor, not SDD renamed. Introduced in
      the chapter where the Station 0 prediction is scored - the reader's guess
      ("write the specification first, then the agent writes the code") turns out
      to describe SDD, which is exactly why the last word of the title is
      *Engineering*.

  - term: specification poverty
    status: defined
    canonical: >-
      The inability to write a good specification, because the engineer lacks
      the vocabulary, the system-design literacy and the requirements reasoning
      to say precisely what they mean.
    first_defined: docs/intro-5-spec-driven-engineering.md
    used_in: [docs/intro-5-spec-driven-engineering.md]
    notes: >-
      The gap SDD leaves, and the chapter's answer to why a tooling workflow
      cannot close it. Taken from the official solution statement's framing;
      attributed there rather than presented as a neutral industry term. Framing
      source: evidence-ledger: bcms-sdd-guide-2026 (still needs-url-verification).
      The chapter's position, stated as a position: no specification format and
      no tool closes this gap, because a tool can hold a specification but
      cannot build the judgment that writes one.

  - term: specify - design - implement - verify
    status: defined
    canonical: >-
      The four stages any piece of software work moves through: specify what
      needs to happen, design how it will happen, implement the design, verify
      that what was built does what was specified.
    first_defined: docs/intro-5-spec-driven-engineering.md
    used_in: [docs/intro-5-spec-driven-engineering.md]
    notes: >-
      NAMING RECONCILED 2026-09-10. The retired intro.md carried this framework
      under two names ("specify-delegate-inspect-verify" and
      "specify-design-implement-verify"); the merge landed on
      specify-design-implement-verify throughout, including the table and both
      worked examples. The governing claim is "contribution is not ownership" -
      an agent can contribute at every stage and can own none of them. A failed
      check returns the work to Specify, not Implement.

  - term: queue
    status: defined
    canonical: "A waiting line that holds requests until the backend is ready to handle them."
    first_defined: docs/intro-5-spec-driven-engineering.md
    used_in: [docs/intro-5-spec-driven-engineering.md]

  - term: schema
    status: defined
    canonical: "The written list of every field a set of data holds."
    first_defined: docs/intro-5-spec-driven-engineering.md
    used_in: [docs/intro-5-spec-driven-engineering.md]

  - term: CSV
    status: defined
    canonical: "A plain text file holding data one line per row."
    first_defined: docs/intro-5-spec-driven-engineering.md
    used_in: [docs/intro-5-spec-driven-engineering.md]

  - term: rate-limited
    status: defined
    canonical: "Capped in how often one user may call it."
    first_defined: docs/intro-5-spec-driven-engineering.md
    used_in: [docs/intro-5-spec-driven-engineering.md]

