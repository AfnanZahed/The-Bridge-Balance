# Concept ledger — every term, defined once, tracked forever.
#
# PLAIN-ENGLISH KEY to the few internal words used in the notes below. None of
# these words may ever appear in front of a reader (canon/corrections.md §9);
# they are shorthand between authors, nothing more.
#
#   Station 0       - the moment a lesson unpacks a term's NAME before
#                     explaining the thing. Used where a name actually helps a
#                     beginner; skipped where the roots need their own lesson.
#   Register 1-4    - how honest a name is. 1 = the name tells you what it is.
#                     4 = the name actively misleads (e.g. "serverless").
#   spine           - the main thread of a chapter, the part everyone reads.
#   foothold        - an optional block of step-by-step mechanics.
#   depth block     - an optional block of extra detail.
#   signature       - the one thing a chapter gives a reader that a search
#     contribution     result would not. For Stages 0-2 that is usually just
#                     explaining something clearly enough that they get it.
#
# Purpose: stop a later chapter redefining what an earlier one established, and
# stop a term being used before it has ever been glossed.
#
# Schema per entry:
#   term:            the term as it appears in prose
#   status:          defined | used-undefined | proposed
#   canonical:       the one MEANING. Reuse the meaning everywhere; reuse the
#                    exact wording where it already fits. Rewriting it plainer
#                    for a beginner chapter is allowed and often required -
#                    what may never change is what the definition SAYS.
#                    (Changed 2026-09-20: "reused verbatim" was freezing dense
#                    wording, and dates inside a definition, into every chapter
#                    that touched the term. canon/corrections.md §12.)
#   registers:       optional alternative wordings of the SAME definition, for
#                    a different context - never a different meaning
#   first_defined:   chapter path where it is introduced
#   used_in:         chapters that rely on it (append as the book grows)
#   notes:           anything an author needs to know before touching it
#
# Rules:
#   - One canonical definition per term. Register variants live under it, never
#     as a second entry.
#   - Before sorting a term, ask whether the lesson needs it at all. In Stages
#     0-2 a hard word must earn its place; if the idea works without it, cut it.
#   - Every surviving term is sorted by the ONE-minute test, measured against a
#     reader who has never programmed. A term they can hold inside a minute is
#     explained inline in twelve words or fewer; one that needs longer cannot be
#     glossed at all and is taught in a passage of its own before it is used.
#   - The inline explanation runs for roughly the term's FIRST TWO OR THREE
#     appearances in the book, then stops; after that the glossary link carries
#     it alone. (Changed 2026-09-20 from "in EVERY chapter, every time", which
#     made pages read like dictionaries.)
#   - A term used with neither is a defect. Record it as status: used-undefined
#     so it gets fixed, not forgotten.
#     See lesson-spine-authoring/reference/mixed-audience.md §4.
#   - Dates and proper nouns inside a canonical definition are RESEARCH, not
#     prose. A chapter reusing the term is not obliged to carry them, and in
#     Stages 0-2 usually should not. canon/corrections.md §4 and §11.

