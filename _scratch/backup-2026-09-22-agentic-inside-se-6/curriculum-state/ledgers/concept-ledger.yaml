    used_in: [docs/intro-2-architecture-map.md]

  - term: token
    status: defined
    canonical: "A signed piece of data proving who you are, checked a moment ago."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: Git
    status: defined
    canonical: "The tool that keeps a complete history of every change ever made to a project."
