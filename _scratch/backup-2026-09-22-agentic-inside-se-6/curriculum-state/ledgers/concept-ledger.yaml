  - term: pull request
    status: defined
    canonical: "A formal 'here is what I changed, please review it before it joins the real project'."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md, docs/intro-5-spec-driven-engineering.md]
    notes: >-
