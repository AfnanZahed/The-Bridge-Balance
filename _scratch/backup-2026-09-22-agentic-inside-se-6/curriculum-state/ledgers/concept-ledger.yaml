    used_in: [docs/intro-2-architecture-map.md, docs/intro-3-editors-and-ides.md, docs/intro-4-terminals-and-cli-agents.md]
    notes: >-
      RESET 2026-09-17: s1-06 reverted to placeholder (owner instruction);
      removed from used_in. It had re-glossed the term more precisely as "the
      folder Git watches", separating the working tree (the files on disk now)
      from the record - the split its staging-area material rested on.

  - term: commit
    status: defined
    canonical: "A labelled, timestamped record of exactly what changed and why."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]
    notes: >-
      RESET 2026-09-17: s1-06 reverted to placeholder (owner instruction);
      removed from used_in. It had re-glossed the term ("one recorded
      snapshot, with a written reason and a link to the commit before it") and
      added the mechanism the intro left out: the author field is free text
