    used_in: [docs/intro-2-architecture-map.md]

  - term: IoT (Internet of Things)
    status: defined
    canonical: "A device such as a smart thermostat or fitness tracker, where a small sensor plays the frontend's role and a tiny chip or cloud service plays the backend's."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: cybersecurity
    status: defined
    canonical: "The question 'what happens if someone lies to this box', asked at every box on the map."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]
    notes: >-
      Deliberately introduced as a cross-cutting lens rather than a separate
      box - the chapter names three places it already appeared (the deleted
      seat check, plain-text passwords, the auth/authz split).

