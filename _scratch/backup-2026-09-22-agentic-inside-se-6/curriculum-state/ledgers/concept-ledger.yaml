      RESET 2026-09-17: s1-04 reverted to placeholder (owner instruction);
      removed from used_in. It had re-glossed the term further, extending it
      materially: an endpoint is "a method and a path that a server promises
      to answer", and the promise includes every named refusal - the address
      PLUS its contract. Kept here as a pointer for whoever re-authors the
      chapter.

  - term: REST (Representational State Transfer)
    status: defined
    canonical: "One common house style for arranging that menu of questions and answers consistently."
