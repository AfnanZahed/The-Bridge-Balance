  - term: logging
    status: defined
    canonical: "Keeping a written trail of what actually happened - which request came in, when, what it did."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: database
    status: defined
    canonical: "A dedicated system whose whole job is storing information reliably and handing it back later, exactly as it was left."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md, docs/intro-5-spec-driven-engineering.md]

  - term: SQL (Structured Query Language)
    status: defined
    canonical: "A database family that stores data in strict tables - rows and columns, like a very disciplined spreadsheet."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: relationship (database)
    status: defined
    canonical: "How one table points at another, instead of repeating the same data on every row."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: NoSQL
    status: defined
    canonical: "A database family that stores looser, more flexible bundles called documents."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: Redis
    status: defined
    canonical: "A database built purely for speed; it holds data in memory rather than on disk."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: cache
    status: defined
    canonical: "A fast copy that saves a slower trip."
