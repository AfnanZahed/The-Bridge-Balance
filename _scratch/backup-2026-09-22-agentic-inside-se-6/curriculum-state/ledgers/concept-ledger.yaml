    used_in: [docs/intro-2-architecture-map.md]
    notes: >-
      Named by Roy Fielding in his 2000 doctoral dissertation
      (evidence-ledger: fielding-rest-2000).

  - term: validation
    status: defined
    canonical: "The checking itself - is this a real name, is there still room."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: middleware
    status: defined
    canonical: "Code that sits in a request's path, running a checklist of jobs before the real logic runs."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]
    notes: >-
      RESET 2026-09-17: s1-04 reverted to placeholder (owner instruction);
      removed from used_in. It had re-glossed the term and taken it further
