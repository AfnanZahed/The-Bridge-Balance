  - term: GitHub
    status: defined
    canonical: "Where a project's history lives online, so more than one person or agent can see it."
    first_defined: docs/intro-2-architecture-map.md
    used_in: [docs/intro-2-architecture-map.md]

  - term: branch
    status: defined
