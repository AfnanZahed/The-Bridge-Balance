      date for "invention" in this chapter's sense. On naming: the dossier
      flags the popular "transfer + resistor" gloss as a simplification Pierce
      did not actually give: he described the device's transresistance,
      paired with the tube's transconductance. The chapter's final wording
      avoids restating the folk version by naming the property Pierce pointed
      at ("the electrical property it controlled") without asserting the
      transresistance/transconductance jargon itself, which would have been an
      unglossed heavy term for a Stage 0 reader.

