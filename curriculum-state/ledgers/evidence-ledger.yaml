    notes: >-
      Verified FOR ch00-introduction and NOT CURRENTLY USED BY IT - recorded so
      the check is not repeated and the source is not lost. The chapter's first
      draft staged this as its Station 0 demonstration, and the owner rejected
      that draft's whole structure before any of it shipped (see
      prerequisite-graph.yaml's ch00-introduction row for the rebuild). The
      claim itself stands and is correct.
      RETIRED AS AN OPENING DEVICE 2026-09-20. This note used to say the claim
      was "available to whichever chapter wants a worked example" - which is how
      a moth and a 1947 logbook ended up opening a rejected Stage 0 draft, and
      it could have happened again. Do not open any page with this story. It may
      still be used LATE in a chapter that is genuinely about verifying claims,
      and nowhere else. canon/corrections.md §1. Two independent
      non-circular sources
      support the correction: Wikipedia's Bug (engineering) entry traces the
      defect sense to engineering jargon "at least as far back as the 1870s"
      and quotes Edison's own 1878 letter; the Edison Papers project records
      Edison's laboratory using it in fall 1878, including his nephew's
      notebook. The Mark II logbook caption - "first actual case of a bug being
      found" - is real, is dated 9 September 1947, and is held by the
      Smithsonian; the caption's own wording is what marks it as a joke about an
      existing term rather than a coinage.
      DELIBERATE HEDGE, recorded so it is not later "corrected": the chapter
      says Edison was writing about bugs "in the 1870s" rather than naming 1878.
      Sources place the usage across the decade and disagree on which single
      document is first, so a specific year would be false precision of exactly
      the kind cluster-1 flags elsewhere (see the `ed`-circa-1969 row and the
      transistor's two real dates).
      REJECTED SOURCE, recorded because it is the top search result for this
      question: IEEE Spectrum's "Did You Know? Edison Coined the Term 'Bug'"
      presents the 1947 moth as the origin, which is the claim the chapter
      exists to correct. It is a charming story, and name-registers.md §4
      already flags that class as suspect in proportion to its charm. Do not
      cite it here.

