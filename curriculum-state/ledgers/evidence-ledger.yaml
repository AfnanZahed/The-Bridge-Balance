  - id: etymonline-program
    name: Etymonline / Wiktionary - origin of "program" (Greek programma, "a written public notice")
    url: https://www.etymonline.com/word/program
    also: https://en.wiktionary.org/wiki/program
    last_verified: 2026-09-10
    expires: null
    questions_asked:
      - {chapter: docs/intro-1-binary-to-programming.md, question: "What did the word 'program' mean before computing, and does the origin predict what programming is?"}
    notes: >-
      Establishes that "program" entered English in the 1630s from Late Latin
      programma, from Greek programma (a written public notice), from
      prographein "to write publicly" (pro- "forth" + graphein "to write") -
      nothing already on the list covers word origins. Two independent
      non-circular sources (Etymonline and Wiktionary) agree, satisfying the
      name-registers verification protocol. Historical claim, does not expire.

  - id: kathleen-booth-assembly-1947
    name: Kathleen Booth - first assembly language and assembler (Birkbeck ARC, late 1940s)
    url: https://en.wikipedia.org/wiki/Kathleen_Booth
    also: https://www.computinghistory.org.uk/det/32489/Kathleen-Booth/
    last_verified: 2026-09-10
    expires: null
    questions_asked:
      - {chapter: docs/intro-1-binary-to-programming.md, question: "Who wrote the first assembly language and assembler, and why did the idea spread?"}
    notes: >-
      Establishes the named origin of assembly, which nothing else on the list
      covers. Sources say Booth co-wrote the first assembly language and
      co-designed the assembler for the ARC at Birkbeck College; the chapter
      says "Kathleen Booth and her colleagues", which matches "co-wrote".

  - id: a0-system-hopper-compiler-nuance
    name: Grace Hopper - A-0 System, 1952 (first automatic translation of a written notation into machine code)
    url: https://en.wikipedia.org/wiki/Grace_Hopper
    also: https://www.computinghistory.org.uk/det/5487/GraceHoppercompletestheA-0compiler
    last_verified: 2026-09-10
    expires: null
    questions_asked:
      - {chapter: docs/intro-1-binary-to-programming.md, question: "What was the first program that turned a written notation into machine code automatically, and who built it?"}
    notes: >-
      Establishes the named origin of the compiler. Careful wording: Hopper's
      A-0 (1952) is the first automatic translation system, but it was a
      linker/compiler in the 1950s sense and Hopper did not originate the idea
      of compilation - the chapter says "the first program that turned a
      written notation into machine code automatically", which is accurate and
      avoids the popular-lore claim that she invented the compiler outright.

