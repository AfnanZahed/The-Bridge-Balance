# Evidence ledger - every canonical source, and which question each chapter
# asks of it.
#
# Purpose:
#   1. Reuse is allowed; paraphrase is not. Two chapters may cite the same
#      incident only if each asks a genuinely different question of it. This
#      file is where that is checked.
#   2. When a number is updated or retracted, this turns "which chapters
#      mention it" from a memory problem into a lookup.
#
# Rules:
#   - No cap on reuse. The test is whether a NEW question is being asked. If
#     you reach for a source again and cannot name a question no other chapter
#     is asking, you have over-used it - at the second reuse or the fifth.
#   - Rotate through: what happened -> why it happened -> what changed because
#     of it -> what would you do differently knowing it.
#   - expires: Stage 3/4 tool claims get 90 days. Industry reports get 12
#     months. Named historical incidents do not expire but their framing does.
#   - status (optional field, per source): absent means canonical - confirmed,
#     citable normally, which is why none of the entries seeded below carry it.
#     `chapter-production` sets `status: proposed` on any NEW entry
#     it adds during research, since that skill proposes sources for an editor
#     (human or the sibling skill) to confirm, not to add unilaterally. A
#     human or the chapter-shipping skill promotes a proposed source to
#     canonical by deleting the status field once it's actually cited in a
#     shipped chapter - do not leave `status: proposed` sitting on a source a
#     chapter already cites, since that would make an already-shipped citation
#     look unconfirmed to the next author who reads this file.
#   - A passage that only points backward ("the METR and Veracode findings
#     elsewhere in this curriculum") without restating the evidence or asking
#     it a fresh question is NOT a new use and gets no questions_asked row
#     here - it is deferring to the chapter where the citation lives.

