# Prerequisite graph - lesson order, dependencies, and authoring state.
#
# Purpose: an author writing chapter 4 needs to know what chapters 1-3 taught
# and what chapter 5 will need. This file is that knowledge. It also drives the
# "you are here" block every chapter carries.
#
# Status vocabulary matches the site's own chapter_state frontmatter:
#   placeholder | text-ready | video-published
# plus:  planned  (in this graph, no file yet)

version: 1
seeded: 2026-08-23
seeded_from: edu-site/docs/ (actual files on disk, 2026-08-23)

# ---------------------------------------------------------------------------
# THIS FILE IS NOT A PLAN - read before treating any row below as settled.
#
# The official curriculum (curriculum_1.md) fixes four STAGES. It does not fix
# a chapter list. Every `id`, `path`, `title`, and `teaches` value below is a
# snapshot of what happens to exist on disk right now (placeholder scaffolding
# from earlier site-building work, mostly) or what has actually shipped - none
# of it is a commitment to write that chapter, with that title, covering
# exactly that content. The author decides a chapter's real scope and shape at
# the moment they sit down to research and write it, per lesson, at runtime -
# not by reading this file as a syllabus to fulfill. Expect entries to be
# retitled, split, merged, dropped, or added as that happens. Update this file
# when it happens; do not treat a mismatch between this file and a freshly-
# authored chapter as an error in the chapter.
#
# Concretely, for Stage 1: it currently has six placeholder files, while the
# official curriculum's Stage 1 focus line names roughly fifteen distinct topic
# areas (software architecture, development environment, core programming,
# packages and project management, OOP and software modeling, Git and GitHub,
# frontend engineering, UI/UX and branding, visual effects and deployment,
# backend engineering, authentication and authorization, frontend-backend
# integration, async and realtime systems, databases, personal branding and
# earning). That gap is not a to-do list to mechanically fill - it's one
# example of why this file can only ever describe the current state, never the
# final one. Reconciling a stage's chapter list against the curriculum's topic
# areas, when and if that's wanted, is `curriculum-architect`'s eventual job,
# and even its output there would be a proposal to revise this file, not a
# fixed target this file is measured against.
# ---------------------------------------------------------------------------

