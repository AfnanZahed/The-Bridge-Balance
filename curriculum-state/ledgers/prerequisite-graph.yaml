      named its own natural split point: "The form validates, and the endpoint
      validates anyway" divides the endpoint's own arc from the mechanisms
      around it. See the progress block's split note - the split was NOT taken
      here, and the decision is surfaced to the owner.

      Asks the shared object: the endpoint that accepts a sign-up, and two
      students tapping submit for the last seat in the same instant. The chapter
      states the race precisely and DELIBERATELY DOES NOT SOLVE IT - a
      transaction is a database mechanism and belongs to the next chapter. This
      is the deliberate hand-off the stage is built around.

      Station 0 decomposes endpoint as COMPOSITIONAL and corrects the guess in
      two directions: size (an endpoint is a contract, mostly a list of named
      refusals) and time ("on the server" is a place, not a moment).

      Corrects a shipped error found in the intro: intro-2 drew a full club as
      403 Forbidden, when the state conflict is 409. Recorded because a live
      chapter was wrong.

      Boundary guards respected: no SQL, no transaction, no constraint, no
      index. Verified by inspection after the run - the chapter contains no
      BEGIN/COMMIT/constraint teaching.

      S7 cost: five dated figures - body-parser's 100 KB default and the 413 it
      produces, GitHub's 60/hour against 5,000/hour authenticated with 100
      concurrent, Stripe's 100/s live and 25 test, 24-hour idempotency-key
      retention, CloudWatch Logs at $0.50/GB with 5 GB free, and Python's
      requests having no default timeout.

      DIAGRAM GAPS for the owner: the two-request interleaving timeline (the
      strongest candidate); the request path with the eight checks placed where
      they run; the thirtieth-seat state diagram with the missing transition
      marked.

  - id: s1-05
    path: docs/stage-01-spec-aware-vibe-engineering/05-databases.md
    title: "The Last Seat: Databases, Constraints, and Data That Outlives the Page"
    stage: 1
    position: 6
    status: text-ready
    scope_multiplier: 1.5
    requires: [s1-04]
    teaches: [tables, rows, columns, data types, schema, primary keys, foreign keys, relationships, constraints, NOT NULL, unique constraints, check constraints, SQL, SELECT, INSERT, UPDATE, DELETE, JOIN, transactions, ACID, atomicity, consistency, isolation, durability, isolation levels, row locking, race conditions, indexes, B-trees, sequential scans, query plans, migrations, document stores, key-value stores and caches, graph databases, choosing a database family, query cost]
    notes: >-
      AUTHORED 2026-09-11 (Stage 1, chapter 5). 4,618 words, ~30.8 min,
      gate-clean. Declares scope_multiplier 1.5.

      THIS CHAPTER CLOSES THE STAGE'S ARC. The backend chapter stated the
      last-seat race and refused to solve it; this chapter solves it, and the
      answer is not "check the count then insert". It is a CHECK constraint the
      database enforces plus a conditional UPDATE ... WHERE seats_taken <
      seat_cap wrapped in BEGIN/COMMIT, with the row lock and Read Committed's
      re-check explained as the reason it holds. The failing version is shown
      honestly first.

      Station 0 decomposes constraint as COMPOSITIONAL (Latin constringere, to
      draw tight) and inverts the guess: a constraint is not friction for a
      careful developer, it is the rule the store enforces when nobody is
      watching - during a race, a second backend, or a stale script.

      Boundary guards respected: references the endpoint that calls it without
      re-teaching HTTP; owns the mechanism of a migration without taking the Git
      workflow around it.

      Sources verified live: PostgreSQL 18.6 and 19 Beta 3, Codd 1970, SQL
      1974, ACID coined 1983, the NoSQL term from the 11 June 2009 meetup,
      MongoDB 8.3.9, Redis 8.8.2 under AGPLv3 from 8.0, Cypher from 2011, and
      the Google SRE latency tiers. One term ships WITHOUT a single-sentence
      definition - `transaction` is glossed as a clause rather than defined
      standalone; flagged for the concept ledger rather than papered over.

      DIAGRAM GAPS for the owner: the race timeline, broken and fixed side by
      side; index against sequential scan.

  - id: s1-06
    path: docs/stage-01-spec-aware-vibe-engineering/06-git-github.md
    title: "A Journal of Every Change: Git, GitHub, and Reviewing What an Agent Wrote"
    stage: 1
    position: 7
    status: text-ready
    scope_multiplier: 1.5
    requires: [s1-02]
    teaches: [repositories, working tree, commits, blobs, trees, tags, content-addressed storage, hashes, staging area, branches, HEAD, merging, merge conflicts, remotes, force push, protected branches, gitignore, push protection, pull requests, code review, commit hygiene, git log, git blame, git bisect, revert versus reset]
    notes: >-
      AUTHORED 2026-09-11 (Stage 1, chapter 6). 5,172 words, ~34.5 min,
      gate-clean. Declares scope_multiplier 1.5.

      Station 0 finds "pull request" a MISLEADING name - register 4 - and this
      is the chapter's best structural move. The name describes the MAINTAINER's
      action (git request-pull generates a request asking your upstream to pull),
      and it omits the review conversation entirely. Scoring that gap is what
      relocates the chapter's centre of gravity from merging to READING, which is
      why a 5,172-word chapter spends its length on the record and the review
      rather than on merge commands.

      Asks the shared object: how work on the club page is recorded, branched,
      reviewed and merged - and specifically what changes when an AGENT wrote
      the diff. The SDE thesis made concrete: the reviewer's job is knowing what
      changed, whether it should have, and whether it is safe.

      ONE SECTION SITS OUTSIDE THE TWELVE STATIONS, recorded rather than hidden:
      "Finding the commit that broke it" (log, blame, bisect, revert vs reset)
      exists because the brief assigns using history to find when something broke
      and no station covers it.

      S2 runs five sentences against the station's two-to-three, recorded: the
      chapter covers two products with two separate authorities (Git's book and
      GitHub's docs) and the station's job is to name the canonical account for
      each.

      Boundary guards respected: deployment and CI/CD deliberately out of scope;
      a migration appears as something a commit can be reverted, not as schema
      teaching.

      S7 cost, all review-specific: the 2006 SmartBear/Cisco case study
      (200-400 LOC over 60-90 minutes finds 70-90% of defects; efficiency drops
      past 400 LOC and above roughly 500 LOC/hour) and Google's ICSE-SEIP 2018
      study of about 9 million changes (median 24 lines, median 1 reviewer, 70%
      reviewed within 24 hours). Deliberately NOT the intro's spent statistics.

      DIAGRAM GAPS for the owner: branch-as-pointer before and after creating a
      branch; the working-tree/index/record three-panel diagram; the review-order
      diagram for agent-written changes.

