    requires: []
    teaches: [binary, Boolean logic, transistor, relay, vacuum tube, bit, stored program (concept)]
    notes: >-
      AUTHORED 2026-09-16 against curriculum-state/stage-0-drafting-plan.md's
      Chapter 1 block. Gate-clean: node scripts/check-chapter.mjs
      --chapter docs/ch01-foundations.md reports 0 errors, 1 warning
