  - id: ch02-programming-is-born
    path: docs/ch02-programming-is-born.md
    title: "From Wires to Words: How Programming Began"
    rewritten_2026_09_20: >-
      Rewritten against the revised canon in the same pass that revised it.
      An everyday thread now carries the chapter: a tireless, very fast helper
      with no judgment at all (example-ledger: ch02-literal-helper), given its
      own short section before the history starts and returned to at every
      step. It is deliberately the same figure a reader will meet as an AI
      coding assistant in Stages 3-4.
      The opening uses a different welcome style from ch01's, per the rule that
      no welcome style returns until four or five chapters later
      (corrections.md §7), and states why the chapter matters to the reader
      specifically. Every section connects to the one before it. Section titles
      explain themselves (canon/naming.md); sidebar_label became "2. How People
      Told a Machine What to Do". Bold is by meaning, not position.
      Gate: 0 errors, 1 warning (safety-floor-absent, deliberate).
    stage: 0
    position: 11
    status: text-ready
    scope_multiplier: 1.0
    requires: [ch01-foundations]
    teaches: [machine code, assembly language, assembler, compiler, FORTRAN]
    notes: >-
      AUTHORED 2026-09-16 against curriculum-state/stage-0-drafting-plan.md's
      Chapter 2 block - the chapter where programming actually enters the
      book, per the plan's own explicit marker: "Nothing downstream may assume
      it earlier." Gate-clean: 0 errors, 1 warning (safety-floor-absent,
      deliberate, same reasoning as ch01).

      Four sections: rewiring ENIAC by hand (the six women who did it - Kay
      McNulty, Betty Jennings, Betty Snyder, Marlyn Wescoff, Fran Bilas, Ruth
      Lichterman), raw numeric machine code and David Wheeler's EDSAC Initial
      Orders (May 1949), Kathleen Booth's assembly language (1947, Birkbeck),
      and Grace Hopper's A-0 (1952) leading to Backus's FORTRAN (April 1957).
      Deliberately presents machine code before assembly using "in the same
      period" framing rather than a false strict date sequence - cluster-1's
      own dossier flags the language ladder as "conceptual, not temporal"
      (Booth 1947, Wheeler 1949, Hopper 1952 and FORTRAN 1957 genuinely
      overlap by a decade), and the plan's approved lesson order already
      encodes that as a deliberate conceptual sequence, not a claim about which
      came first in time.

      Ends exactly where the plan requires: FORTRAN exists and works, no other
      languages are named or surveyed - that is Chapter 3's job
      ("One Language Was Never Enough").

      Signature contribution: the "ladder is conceptual, not temporal"
      correction made explicit to the reader, plus the economic argument
      (programmer time became more expensive than computer time) as the real
      reason FORTRAN mattered, ahead of any aesthetic one - both taken directly
      from cluster-1's structural recommendation.

      TERM OVERLAP WITH intro-1, HANDLED VIA REUSE NOT DUPLICATION: this
      chapter's core vocabulary (machine code, assembly language, assembler,
      compiler) was already canonically defined by the old, still-live intro-1.
      Rather than creating a second competing definition, concept-ledger.yaml's
      existing entries for those four terms were extended with `used_in` and a
      short reuse note, following the same pattern already established for
      terms like "blast radius" and "endpoint" being re-glossed per chapter.
      first_defined stays pointed at intro-1 for now; repointing it is a
      decision for whenever intro-1 is actually retired, not before.

      Ends on a retrieval prompt (S10): the reader reconstructs, from memory,
      the four things a program has been across the chapter and what each form
      still could not do.

      REVISED 2026-09-17, formatting only: same fix as ch01-foundations (see
      its note above) - added topic-sentence and term-first-use bold (now 50
      markers, was 0) and one comparison table (rewiring / machine code /
      assembly language) covering only the first three of the chapter's four
      forms, deliberately stopping before FORTRAN so the closing retrieval
      prompt - "name the four things... without looking back" - still
      requires genuine recall rather than a glance at a table. No facts or
      wording changed, gate still 0 errors.

