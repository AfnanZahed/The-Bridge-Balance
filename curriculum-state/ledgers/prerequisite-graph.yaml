      Verified 2026-09-20 against the live file: Hollerith, Tukey, von Neumann
      and the December date appear zero times. All of it remains in
      evidence-ledger.yaml as backstage research, which is where it belongs.
      "Matching the plan exactly" is also no longer a virtue - the plan's
      Anchors column is the thing that made this chapter too dense
      (corrections.md §4 and §11, stage-0-drafting-plan.md).

      REWRITTEN 2026-09-20 against the revised canon, in the same pass that
      revised it. What changed:
      - An everyday thread now carries the chapter: a torch signalled across a
        dark street (example-ledger: ch01-torch-across-the-street). It does the
        work the named incidents used to be asked to do.
      - The opening welcomes the reader, links back to the stage introduction,
        lists what the chapter covers AND why each piece matters, and ends
        "Let's start with something you already know how to do."
