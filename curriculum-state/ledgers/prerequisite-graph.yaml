      nothing executable or shippable to warn about).

      Three sections: two-state switches, instructions as a physical object,
      and the switch's three generations (relay, vacuum tube, transistor).
      CORRECTED 2026-09-20. This note used to describe the chapter as "matching
      the plan exactly" and listed what it carried: "Boole 1854, Shannon 1937,
      Jacquard 1801, Babbage 1837, Lovelace 1843, Hollerith ... Bardeen and
