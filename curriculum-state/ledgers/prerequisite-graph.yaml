        The old version had a warm block on top and a cold section under it.
      - The thesis/AI paragraph was REMOVED ("Nothing about that changes later
        in this book, even when a machine looks like it is thinking for
        itself..."). The six invariants are stage-level now; a binary chapter
        is not the place to argue about agents. canon/thesis.md.
      - Vocabulary simplified: "a sliver of treated germanium" became "a tiny
        piece of specially treated crystal".
      - Section titles now explain themselves (canon/naming.md): "Yes, No, and
        Nothing In Between" became "Why a Computer Only Says Yes or No"; "One
        Idea, Three Bodies" became "The Same Switch, Built Three Different
        Ways". sidebar_label became "1. How a Machine Holds a Number".
      - Bold is by meaning, not paragraph position.
      Gate: 0 errors, 1 warning (safety-floor-absent, deliberate - this chapter
