  - id: s1-01
    path: docs/stage-01-spec-aware-vibe-engineering/01-foundations.md
    title: "The Boxes and the Walls: Where a Rule Has to Live Before You Write the Code"
    stage: 1
    position: 2
    status: text-ready
    scope_multiplier: 1.5
    requires: [intro-5]
    teaches: [software architecture, architecture before code, component, boundary, interface, coupling, cohesion, information hiding, monolith, layered architecture, client-server, event-driven architecture, distributed monolith, blast radius, architecture smells, whiteboard test, boundary enforcement]
    notes: >-
      AUTHORED 2026-09-11 (Stage 1, chapter 1). 4,218 words, ~28.1 min,
      gate-clean at 0 errors and 0 warnings. Declares scope_multiplier 1.5.

      Station 0 decomposes architecture and finds it a METAPHORICAL name
      (Greek arkhitekton, chief builder, entering English in the 1560s) that
      promises a plan settled once and built to. The prediction is scored as
      half right, and the half it misses is the chapter's subject: a building's
      plan stays true when the concrete sets, while a software architecture is
      only ever as true as its enforcement. Move a rule and the architecture
      changes while the diagram does not.

      Asks the shared object: where does each box live, and which boundary must
      the thirty-seat rule sit behind so a student cannot reach around it? The
      answer most people reach for - put the rule in the form, where the click
      happens - is named and refused.

      Boundary guards respected: HTTP named only as the channel between boxes;
      no REST, status codes, middleware or logging; no component internals; no
      SQL; no Git; no language syntax.

      S7 cost: Uptime Institute's 2025 survey - 57% of major outages above
      US$100,000, one in five above a million. S6 blast radius: the 4 October
      2021 Facebook/Instagram/WhatsApp outage, about six hours, 2.9bn monthly
      users, caused by one routine configuration change.

      DIAGRAM GAP for the owner: one labelled figure of the club page's boxes
      and the wall between them, with the thirty-seat rule marked inside the
      seat-counter box. Currently carried as prose plus a five-step foothold.

  - id: s1-02
    path: docs/stage-01-spec-aware-vibe-engineering/02-core-programming.md
    title: "Reading Code You Did Not Write: Variables, Loops, and the Failures That Stay Quiet"
    stage: 1
    position: 3
    status: text-ready
    scope_multiplier: 1.5
    requires: [s1-01]
    teaches: [reading code, variables, types, strings, booleans, conditionals, truthiness, loops, iteration, functions, parameters, return values, scope, collections, lists and arrays, dictionaries and objects, index, key, file handling, exceptions, traceback, call stack, syntax errors, runtime errors, debugging, off-by-one, boundary value, Python versus JavaScript]
    notes: >-
      AUTHORED 2026-09-11 (Stage 1, chapter 2). 4,729 words, ~31.5 min,
      gate-clean. Declares scope_multiplier 1.5.

      SHAPE: Practice with a Concept core, and the shape choice is recorded
      rather than assumed. The deliverable skill is a repeatable human activity
      - reading agent-written code and judging whether it is correct - and S10
      is an actual rep. The reading vocabulary is taught only to the depth the
      break requires, never as a writing tutorial, because in this book the
      agent writes the code and the human's job is to read it and know when it
      is wrong.

      Station 0 finds reading a METAPHORICAL name shading into MISLEADING: it
      borrows the model of reading prose, which implies that making sense IS
      working. The guess is scored - "makes sense" establishes only that the
      code is consistent with ONE reading of it.

      Signature move: trace the BOUNDARY value and the EMPTY value before
      accepting a rule. Asks the shared object: the thirty-seat cap as a
      variable, then a conditional, then a function the system calls, then
      broken - the >= that becomes > and admits seat thirty-one, the deleted
      empty-name check, and the sharper case of a check that is PRESENT and
      wrong (`name is None` misses "").

      The break is deliberately NOT intro-3's spent break (an agent deleting
      the check): this one is a guard that is still there and still wrong,
      which is a reading failure rather than an omission failure.

      S7 cost: Ariane 5 Flight 501, 4 June 1996 - lost 37 seconds after
      lift-off, over US$370 million, guidance software reused unchanged from
      Ariane 4 and never re-read against the new machine.

      DIAGRAM GAP for the owner: one axis of the taken value from 28 to 32,
      marking where >= and > admit, showing seat thirty-one slipping through.

