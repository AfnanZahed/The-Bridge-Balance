  - id: intro-5
    path: docs/intro-5-spec-driven-engineering.md
    title: "Two Ways to Fail, and the Bridge Between Them: Spec-Driven Engineering"
    stage: 0
    position: 4
    status: text-ready
    scope_multiplier: 1.5
    requires: [intro-4]
    teaches: [Spec-Driven Engineering, Spec-Driven Development, specification poverty, vibe coding, the two extremes (over-caution and over-trust), the specify-design-implement-verify responsibility loop, contribution is not ownership, the Development versus Engineering distinction, the reviewer's three questions]
    notes: >-
      AUTHORED 2026-09-10 (Phase 2): merge-and-rewritten through
      lesson-spine-authoring and gate-checked clean (3,940 words, ~26.3 min, 0
      errors, 0 warnings). The finale - the destination of the 0-to-1 journey.
      It was a raw, unedited concatenation of the old docs/intro.md body
      followed by the old docs/intro-4-two-extremes-and-sde.md body; it is now
      one coherent chapter written for an absolute beginner.

      SDD VERSUS SDE - RESOLVED 2026-09-10. Phase 1 deliberately left open
      whether to draw this line by name. It is now drawn explicitly, in the
      section where the Station 0 prediction is scored: the reader's guess
      ("write the specification first, then the agent writes the code")
      describes Spec-Driven Development, not this chapter - which is exactly
      why the last word is *Engineering*. SDD is attributed correctly as the
      tool-adopted method (Spec Kit, Kiro, Claude Code, from 2025) formalised
      in a February 2026 paper. SDE is stated as its successor, not SDD renamed,
      and the gap between them is named *specification poverty*. The chapter
      then states this book's own position as a position rather than as settled
      fact: no specification format and no tool closes that gap, because a tool
      can hold a specification but cannot build the judgment that writes one.

      Two inherited naming inconsistencies were reconciled and now read one way
      throughout, including in the tables and both worked examples: the
      four-part loop is specify-design-implement-verify (not
      specify-delegate-inspect-verify), and the two failure modes are
      over-caution and over-trust (not surrender and resistance), matching
      canon/thesis.md.

      Cross-chapter pointers were re-pointed for the new sequence: the raw
      merge had been written when the chapter before it was the architecture map
      and the one before that binary. Positional callbacks ("the previous
      chapter") were rewritten as named ones ("the architecture map from the
      second chapter") so they cannot go stale again.

      The Mermaid fence was removed - no diagram is generated anywhere in this
      book. What it showed is now prose: a failed verification sends the work
      back to Specify, not to Implement, because a failed check usually means
      the requirement was wrong or incomplete rather than the code mistyped.

      SCOPE NARROWED, recorded rather than cut silently. The inherited material
      carried Stage 3-4 territory - the four safety boundaries, the
      experiment-to-system transition, agent governance boundaries and the
      multi-agent ownership architecture. The re-authoring judged these out of
      scope for a finale now that the sequence runs binary -> architecture ->
      editors -> terminals -> SDE. The named examples they carried (the
      five-agent pipeline, the support-ticket agent, the admin dashboard, the
      relative's delivery service) are unspent again; see
      example-ledger.yaml's intro-worked-examples correction. Also dropped: the
      Replit and Enrichlead incidents and the AWS tool-switching figures, all of
      which belong to the stage that teaches those boundaries.

      LENGTH CHECKED against the other four, per the pre-agreed rule: at 3,940
      words this is the SHORTEST of the four newly-authored chapters
      (intro-2 4,500, intro-3 4,122, intro-4 4,001) and is not
      disproportionately long. It therefore stays ONE FLAT FILE and does not
      become a sidebar sub-category. The pre-agreed split condition was not
      met, so the split was not taken - recorded as a judgment, not an
      oversight. If the owner wants the intro sub-lesson pattern anyway, this
      chapter has three natural seams: the two failure modes plus the
      four-stage loop and the SDD/SDE line as an index; the two worked examples
      (CSV export, payment refactor); and the cost, reviewer and lineage
      material.

      scope_multiplier 1.5 - multiple interacting concepts forming one system,
      which is the calibration table's own description.

