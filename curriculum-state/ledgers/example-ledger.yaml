# Example ledger - worked examples and scenarios already spent.
#
# Purpose: stop the to-do app appearing in five chapters, and stop two chapters
# reaching independently for the same scenario. Record rejections too - an
# example considered and dropped is as useful to the next author as one used.
#
# Default rule: ONE worked example carries a chapter, chosen for how much
# explanatory work it does rather than for how impressive it looked in research.
# Every example is real and named - no foo, no bar, no Acme Corp, no to-do app.

version: 1
seeded: 2026-08-23

examples:

  - id: intro-no-single-example
    chapter: docs/intro.md
    object: null
    status: resolved-by-deviation
    notes: >-
      RESOLVED 2026-08-24. The intro uses several distinct named scenarios
      rather than one traced object - a beginner's first AI-assisted change, a
      team's CSV export, a five-agent production pipeline - because its job is
      breadth across the whole curriculum's territory, not depth on one example.
      A single to-do-app scenario could not also carry the multi-agent
      architecture material without trivialising it.
      todo-app-trace stays reserved and unspent - see below - because the
      intro's re-authoring is the one lesson it was reserved for that has now
      shipped without it; it remains available for the Stage 1 "What is an AI
      coding agent?" lesson it was also reserved for.
      See intro-worked-examples below for the actual set and the
      question each one answers.

  - id: intro-worked-examples
    chapter: docs/intro.md
    object: "Multiple distinct named scenarios rather than one shared object (see intro-no-single-example)"
    status: spent
    notes: >-
      Breakdown, each with the question the chapter asks of it:
      The opening sections use the two real-world incidents
      already tracked in evidence-ledger.yaml (Replit, Lemkin) rather than
      invented scenarios - no new example entry needed for those. From
      Later sections:
      (1) rate-limiting an internal API endpoint hammered by a misbehaving
      client [worked example] - asks: what does the four-part
      specify/delegate/inspect/verify framework look like applied start to
      finish on one small, concrete task?
      (2) adding a CSV data-export endpoint [worked example] - asks:
      what does the specify/design/implement/verify table look like applied
      to a request that sounds simple but has real judgment calls hiding in
      it (which fields, what row-count strategy)?
      (3) an agent-assisted refactor of a payment-processing function that
      passes every existing test [second worked
      example] - asks: what does the verify stage catch that "tests pass"
      doesn't, when the interesting judgment call is at verify rather than
      specify or implement?
      (3b) a relative's small delivery service, and a request to add a
      cancel-order page [shared across two sections] - the one genuinely shared
      object in the intro. It is asked two different questions: what is
      invisible from a page that looks finished (driver notification,
      confirmation, double-cancel)? and what do the four boundaries -
      environment, data, authority, verification - actually answer for this
      specific task, traced start to finish?
      (4) an admin dashboard that grew from a weekend hack - its CSV export,
      its login flow, a subscription-cancellation webhook handler
      [worked inventory] - asks, per feature: has this
      specific piece crossed the users/money/secrets/durable-data line from
      experiment into system, and when?
      (5) an internal support-ticket agent that reads the company wiki and
      drafts customer responses pending review [worked example] - asks:
      how do the four governance boundaries (environment, trust, data,
      apprenticeship) apply to one concrete, currently-plausible agent
      surface?
      (6) a five-agent production pipeline (planning, retrieval,
      implementation, testing, deployment agents) and, within it, a
      refund-issuing tool call [worked example] - asks: how do
      role/handoff/failure-domain contracts and a permission/idempotency
      contract actually get specified across a multi-agent system rather than
      a single coding agent?
      None of these six reuses a reserved example below; none is reserved for
      future use elsewhere, since each is scoped tightly enough to its own
      teaching point that reuse would likely mean re-litigating the same
      scenario rather than asking it something new.

  - id: todo-app-trace
    chapter: null
    object: "A one-line request ('build me a to-do app') traced end to end"
    status: reserved
    reserved_for: "Stage 1 \"What is an AI coding agent?\" (no longer reserved for docs/intro.md - the intro shipped without it; see intro-no-single-example)"
    notes: >-
      Named in the founding brief and in framework drafts, never shipped.
      Reserve it for exactly one lesson. Chosen because it stays legible whether
      a chapter examines it in one sentence or in a full step-by-step trace.
      If used, log which questions each chapter asks of it here.

  - id: feature-add-ticket
    chapter: null
    object: "A real feature-add ticket: write a 3-line spec, prompt, review the diff against it"
    status: reserved
    reserved_for: a Stage 1 or Stage 3 lesson
    notes: >-
      Framework draft example. Unspent. Not used by the intro
      - the intro's own rate-limiting/CSV-export scenarios cover similar
      ground with different specifics, leaving this one genuinely free rather
      than redundant.

  - id: repo-permission-contract
    chapter: null
    object: "Designing a permission and verification contract for an agent on a real repository"
    status: reserved
    reserved_for: a Stage 3 or Stage 4 lesson
    notes: >-
      Too heavy for Stage 1. Not used by the intro revision - the intro used a
      five-agent pipeline example instead (see intro-worked-examples), which
      covers multi-agent contract design rather than single-repository
      permission design; this example stays free for the more targeted lesson
      it was reserved for.
