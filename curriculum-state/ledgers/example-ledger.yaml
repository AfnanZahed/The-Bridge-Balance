  - id: ch01-torch-across-the-street
    chapter: docs/ch01-foundations.md
    object: "A torch signalled across a dark street to a friend"
    status: in-use
    introduced: 2026-09-20
    notes_current: >-
      THE CHAPTER'S EVERYDAY THREAD, added in the 2026-09-20 rewrite. Invented,
      not historical, and that is deliberate.
      It carries three separate jobs in sequence, which is why it was chosen
      over a new example per section: (1) two agreed states can carry any
      message; (2) why TWO and not ten - dim and medium blur across a dark
      street, on and off do not, which is the noise argument made physical;
      (3) two torches wired so the second lights only when both are on - the
      move from carrying a signal to working one out.
      It then hands over deliberately: a torch signal disappears when you let
      go of the button, a punched card does not. That is the bridge into the
      chapter's second section.
      REUSABLE. A later chapter returning to the torch is a good choice, not a
      repetition - the reader already has the picture.
    superseded_entry: >-
      This row replaced `ch01-no-worked-example`, whose reasoning is kept below
      because the mistake is instructive.
    notes: >-
      REVERSED 2026-09-20 - this entry is kept as the record of a decision the
      owner has since rejected, and ch01 is scheduled for a rewrite that fixes
      it.
      The original reasoning was: "Chapter 1 is a Concept-shape history chapter
      whose spine IS its real named incidents (Jacquard's loom, Babbage and
      Lovelace, Hollerith's tabulator, the relay/tube/transistor sequence, the
      2003 Belgian election bit-flip) ... A reader would not have gained from
      inventing one."
      Why that was wrong: it treats a chain of named historical people as the
      thing a beginner holds on to. It is not. A reader who has never
      programmed needs ONE everyday object they can picture, returned to with a
      new question each time - the way the old intro chapters used a school
      sign-up page capped at thirty seats. The history then hangs on that
      thread instead of being the thread.
      "The subject is its own example" is not an acceptable answer for a
      Stage 0-2 chapter. If nothing real fits, invent something concrete.

  - id: ch02-literal-helper
    chapter: docs/ch02-programming-is-born.md
    object: "A tireless, very fast helper with no judgment at all"
    status: in-use
    introduced: 2026-09-20
    notes_current: >-
      THE CHAPTER'S EVERYDAY THREAD, added in the 2026-09-20 rewrite. Invented.
      Given its own short section before the history starts, then returned to
      at every step: told the wrong direction they walk until they reach the
      sea; directed in numeric codes it gets worse; given short words it gets
      bearable; given FORTRAN it gets pleasant - and they still have no
      judgment, which is the chapter's real closing point.
      DELIBERATELY BUILT TO CARRY FORWARD. This is the same helper a reader
      will meet again as an AI coding assistant in Stages 1 and 2: fast, tireless,
      confident, no judgment. Seeded here on purpose so the later chapters can
      call back to something the reader already owns rather than arguing from
      scratch. Do not spend it on a minor point in between.
    superseded_entry: >-
      This row replaced `ch02-no-worked-example`, whose reasoning is kept below
      because the mistake is instructive.
    notes: >-
      REVERSED 2026-09-20, same as ch01-no-worked-example above, and for the
      same reason.
      The original reasoning was that the chapter's spine is four real
      historical steps (ENIAC's plugboards, machine code, Kathleen Booth's
      assembly language, Grace Hopper's A-0 and Backus's FORTRAN), each already
      a concrete named object, so "inventing a separate toy example on top would
      compete with, not clarify, the real history".
      Why that was wrong: named and dated is not the same as picturable. A
      beginner has no image for a plugboard. One everyday thread - something
      they already understand being given to someone who follows instructions
      exactly and literally - carries all four steps and makes the history
      land instead of replacing it.

