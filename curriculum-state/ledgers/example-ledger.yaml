  # =========================================================================
  # STAGE 1 - added 2026-09-11, when all six Stage 1 chapters shipped.
  # =========================================================================
  #
  # The stage continued the intro's shared object rather than introducing a new
  # one, and did NOT spend anything reserved. The entries below record the one
  # shared object, the per-chapter questions asked of it, the supporting named
  # examples, and every rejection the authoring agents reported.

  - id: stage1-club-signup-continuation
    chapter: docs/stage-01-spec-aware-vibe-engineering/01-foundations.md
    object: "The same school AI club sign-up page capped at thirty seats — continued from intro-2, not replaced"
    status: spent
    also_used_in:
      - docs/stage-01-spec-aware-vibe-engineering/01-foundations.md
      - docs/stage-01-spec-aware-vibe-engineering/02-core-programming.md
      - docs/stage-01-spec-aware-vibe-engineering/03-frontend.md
      - docs/stage-01-spec-aware-vibe-engineering/04-backend.md
      - docs/stage-01-spec-aware-vibe-engineering/05-databases.md
      - docs/stage-01-spec-aware-vibe-engineering/06-git-github.md
    notes: >-
      THE central decision of the Stage 1 run, recorded on its own entry because
      it governs all six chapters: the stage returned to the intro's shared
      object and asked it one new question per layer, rather than inventing a
      second teaching object. No chapter introduced a to-do app, a notes app or
      a blog. Each chapter's question, in order:
      s1-01 - where does each box live, and which boundary must the thirty-seat
      rule sit behind so a student cannot reach around it?
      s1-02 - the cap as readable code: a variable, a conditional, then a
      function the system calls; then broken by an off-by-one and by a check
      that is present and wrong.
      s1-03 - the form a student actually clicks, in three acts (before, during,
      after a tap), and why neither the number on screen nor the disabled button
      can decide admission.
      s1-04 - the endpoint that must refuse, and two students tapping submit for
      the last seat in the same instant. States the race; deliberately does NOT
      solve it.
      s1-05 - the row written to the database and the thirty-first sign-up that
      must not get in. Solves the race the previous chapter stated.
      s1-06 - how work on this page is recorded, branched, reviewed and merged,
      and what changes when an agent wrote the diff.
      THE STAGE'S ARC DEPENDS ON THIS: s1-04 states a problem it refuses to
      solve and s1-05 resolves it. A future edit that changes either chapter's
      handling of the race breaks the other.

  - id: s1-01-facebook-outage-2021
    chapter: docs/stage-01-spec-aware-vibe-engineering/01-foundations.md
    object: "Facebook/Instagram/WhatsApp outage, 4 October 2021"
    status: spent
    notes: >-
      S6 blast radius at a scale a reader can feel: about six hours, 2.9 billion
      monthly users, one routine configuration change to the routers carrying
      Facebook's traffic, and the internal tools staff would have used to fix it
      taken down inside the same failure.

  - id: s1-01-prime-video-monolith-2023
    chapter: docs/stage-01-spec-aware-vibe-engineering/01-foundations.md
    object: "Amazon Prime Video's 2023 move from distributed serverless back to a single program"
    status: spent
    notes: >-
      The depth block's counter-argument to splitting everything: about a 90%
      cost reduction from moving the other way. Used to show that a boundary
      earns its place only when the two sides genuinely change apart.

  - id: s1-02-ariane-501
    chapter: docs/stage-01-spec-aware-vibe-engineering/02-core-programming.md
    object: "Ariane 5 Flight 501, 4 June 1996"
    status: spent
    notes: >-
      S7's real magnitude: lost 37 seconds after lift-off, over US$370 million,
      guidance software reused unchanged from the smaller Ariane 4 and never
      re-read against the machine it now ran on. The chapter's point is that the
      code did its job correctly for years.

  - id: s1-02-break-guard-present-and-wrong
    chapter: docs/stage-01-spec-aware-vibe-engineering/02-core-programming.md
    object: "The thirty-seat guard broken three ways: the >= that becomes >, the deleted empty-name check, and a check that is present and wrong"
    status: spent
    notes: >-
      ADDITIVE, NOT A REUSE, and worth recording because it sits close to a
      spent example. intro-3 already spent "an agent deletes the thirty-seat
      check". This chapter's break is deliberately different in kind: the guard
      is STILL THERE and still wrong, which makes it a reading failure rather
      than an omission failure. The third variant - `name is None` missing an
      empty string - is the sharpest, because the line reads as a correct check.

  - id: s1-04-last-seat-interleaving
    chapter: docs/stage-01-spec-aware-vibe-engineering/04-backend.md
    object: "The millisecond interleaving where two sign-ups both read 29 seats free and both answer 201"
    status: spent
    notes: >-
      The stage's pivotal example and the reason s1-05 exists. Deliberately
      stopped short of the fix - no SQL, no transaction, no constraint appears in
      s1-04 - so the databases chapter can close it. Verified by inspection
      after the run: s1-04 contains no BEGIN/COMMIT/constraint teaching.

  - id: s1-05-constraint-and-transaction-fix
    chapter: docs/stage-01-spec-aware-vibe-engineering/05-databases.md
    object: "The same race resolved: a CHECK constraint plus a conditional UPDATE inside a transaction"
    status: spent
    notes: >-
      Pays off s1-04's open question. Shows the failing check-count-then-insert
      honestly first, then the fix, and explains why the row lock and Read
      Committed's re-check make it hold. This is the only place in the book that
      closes the last-seat race; do not re-solve it elsewhere.

  - id: s1-06-agent-diff-review
    chapter: docs/stage-01-spec-aware-vibe-engineering/06-git-github.md
    object: "A pull request against the club page whose diff was written by an agent, with no human author"
    status: spent
    notes: >-
      The SDE thesis made concrete: the reviewer may not have written a line of
      what they are approving. The S10 retrieval diff is `<` changed to `<=` on
      the seat check - the off-by-one at the boundary, reviewed rather than
      authored, which is a different failure from intro-3's deletion.

  - id: s1-rejections-2026-09-11
    chapter: null
    object: "Examples each Stage 1 chapter considered and rejected"
    status: rejected
    notes: >-
      Recorded because a rejection is worth as much as a use, and because these
      remain available. All six agents were asked to report rejections.
      Therac-25 (s1-02, considered for S7) - rejected: involves patient deaths,
      heavier than a syntax-level reading lesson needs; Ariane 5 carries the
      same "reused code, changed context, unverified" lesson with a cleaner
      quotable cost.
      "Code is read far more than it is written" (s1-02) - rejected: could not
      be pinned to a primary, non-circular source in session.
      Knight Capital, 1 August 2012 (s1-04) - rejected: a deployment-consistency
      failure (new code on seven of eight servers), not an endpoint-enforcement
      failure. Belongs to a deployment lesson.
      nginx client_max_body_size default (s1-04) - rejected: could not be
      confirmed from nginx's own documentation in session; body-parser's 100 KB
      is primary-sourced.
      A REAL public duplicate-sign-up or double-charge incident (s1-04) -
      rejected as UNVERIFIABLE, and recorded as an honest gap: the chapter's
      evidence is a named platform's documented behaviour plus an expired draft
      instead of a half-remembered story.
      A mobile-vs-desktop traffic split figure (s1-03) - rejected: sources
      disagree month to month, so a single number would be a dated snapshot
      masquerading as a fact.
      A specific component-library bundle-size figure (s1-03) - rejected: only
      secondary comparison blogs carried numbers, which is the charm-to-trust
      risk the brief warns about.
      A bank passbook as the s1-06 anchor - rejected in favour of the
      numbered-copies habit ("signup-page-v4-final.js"), which is closer to
      something a first-time reader has personally done.
      The old placeholder's notes-table-with-JSONB example (s1-05) - rejected:
      would introduce a second object and duplicate the MongoDB beat.
