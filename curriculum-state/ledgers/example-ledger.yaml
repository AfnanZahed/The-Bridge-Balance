# Example ledger - worked examples and scenarios already spent.
#
# Purpose: keep a record of every example the book has used, so the next author
# chooses deliberately instead of blindly. Record rejections too - an example
# considered and dropped is as useful to the next author as one used.
#
# Default rule: ONE worked example carries a chapter, chosen for how much
# explanatory work it does rather than for how impressive it looked in research.
#
# REUSE IS ALLOWED AND OFTEN BETTER (changed 2026-09-20). An example is LOGGED,
# not SPENT. Before choosing one, read what is already here and decide: would a
# new example teach better, or would returning to one the reader already has a
# picture for? An idea the reader already owns costs them nothing to pick up.
# The old "already spent" rule caused a slow drift toward rarer examples -
# which, in a history stage, means named historical ones.
#
# INVENTED EXAMPLES ARE LEGITIMATE (changed 2026-09-20). "Imagine you can only
# signal a friend across the street with a torch: on, or off" is a good example.
# The old rule read "every example is real and named", and it was read as "attach
# a real person, place and year to everything" - a main source of Stage 0's
# density. What is still banned is the EMPTY PLACEHOLDER: foo, bar, Acme Corp,
# the generic to-do app. Examples with nothing in them to picture.
# canon/voice.md §"Analogies, examples and stories"; corrections.md §4.

