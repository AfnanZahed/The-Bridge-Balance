# Example ledger - worked examples and scenarios already spent.
#
# Purpose: stop the to-do app appearing in five chapters, and stop two chapters
# reaching independently for the same scenario. Record rejections too - an
# example considered and dropped is as useful to the next author as one used.
#
# Default rule: ONE worked example carries a chapter, chosen for how much
# explanatory work it does rather than for how impressive it looked in research.
# Every example is real and named - no foo, no bar, no Acme Corp, no to-do app.

version: 1
seeded: 2026-08-23
