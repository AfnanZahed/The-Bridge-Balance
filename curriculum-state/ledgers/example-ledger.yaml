  - id: club-signup-shared-object
    chapter: docs/intro-2-architecture-map.md
    object: "A school AI club sign-up page, capped at thirty seats"
    status: spent
    notes: >-
      NEW 2026-09-10 (Phase 2), and a change of shape worth flagging: the
      resequenced intro now has ONE genuinely shared object, where the old
      intro deliberately had none (see intro-no-single-example above). It is
      built once in intro-2 ("build one thing together, one wall at a time")
      and then returned to by every later chapter, each asking it a different
      question:
      intro-2 asks: what does each box in a real system exist to fix, and where
      must a rule be enforced so the user cannot reach it? Beats: the frontend
      trap (developer tools let any student delete the seat check), the
      goldfish problem (memory lost on restart), who is allowed to cancel whose
      signup, two builders colliding on the same code, and the laptop-to-live
      gap.
      intro-3 asks: what does an AI-driven tool do to a rule it does not
      understand? (the deliberately broken diff below).
      intro-4 asks: how wide is an agent's reach, depending on the folder you
      launched it from? (the scope example).
      intro-5 asks: which stage owns the seat cap, and who owes the three
      stages an agent does not own?
      Reuse here is deliberate and additive - each chapter asks a question no
      other asks. Do not add a fifth use without one.

  - id: intro-3-broken-diff
    chapter: docs/intro-3-editors-and-ides.md
    object: "An agent removing the thirty-seat check from the club sign-up page"
    status: spent
    notes: >-
      The chapter's deliberately broken example: you ask a driven tool to
      "refuse a signup when the club is full", and it returns a diff that
      removes the guard entirely, leaving the club uncapped. Nothing crashes,
      the page still saves, and the bug is silent until the thirty-first student
      signs up. Asks: what exactly does an AI-driven tool fail at, and why can
      it not ask? Answer the chapter gives: it failed at knowing what the code
      was for, not at writing code. This is the chapter's argument for the
      review discipline that intro-5 then formalises.

  - id: intro-4-shell-mismatch
    chapter: docs/intro-4-terminals-and-cli-agents.md
    object: "`ls` typed into Command Prompt on a fresh Windows machine"
    status: spent
    notes: >-
      The chapter's deliberately broken example, and the most common beginner
      failure in the field: a tutorial written on a Mac says `ls`, the shell in
      front of you answers "'ls' is not recognized as an internal or external
      command". Asks: when a command fails, is the command wrong or is the
      shell wrong? The message says the shell has never heard of the name,
      which sends the reader to ask which shell they are in - the chapter's
      whole point about terminal types. Paired with the working version (`pwd`,
      then `dir`).

  - id: intro-5-one-stage-cut
    chapter: docs/intro-5-spec-driven-engineering.md
    object: "Four short scenarios, one per stage of the specify/design/implement/verify loop, each with that stage skipped"
    status: spent
    notes: >-
      Four miniature failures rather than one traced object: a cache whose
      time-to-live nobody chose (Specify skipped), a queue whose failure mode
      nobody decided (Design skipped), a large diff accepted unread (Implement
      over-delegated), and a change shipped because the obvious case worked
      (Verify treated as optional). Asks: what does each stage actually
      prevent, shown by its absence? Recorded as an omission-style entry - the
      chapter's point is the missing judgment, so these are deliberately
      negative examples.

