  - id: intro-worked-examples
    chapter: docs/intro-5-spec-driven-engineering.md
    object: "Multiple distinct named scenarios rather than one shared object (see intro-no-single-example)"
    status: spent
    notes: >-
      Breakdown, each with the question the chapter asks of it:
      The opening sections use the two real-world incidents
      already tracked in evidence-ledger.yaml (Replit, Lemkin) rather than
      invented scenarios - no new example entry needed for those. From
      Later sections:
      (1) rate-limiting an internal API endpoint hammered by a misbehaving
      client [worked example] - asks: what does the four-part
      specify/delegate/inspect/verify framework look like applied start to
      finish on one small, concrete task?
      (2) adding a CSV data-export endpoint [worked example] - asks:
      what does the specify/design/implement/verify table look like applied
      to a request that sounds simple but has real judgment calls hiding in
      it (which fields, what row-count strategy)?
      (3) an agent-assisted refactor of a payment-processing function that
      passes every existing test [second worked
      example] - asks: what does the verify stage catch that "tests pass"
      doesn't, when the interesting judgment call is at verify rather than
      specify or implement?
      (3b) a relative's small delivery service, and a request to add a
      cancel-order page [shared across two sections] - the one genuinely shared
      object in the intro. It is asked two different questions: what is
      invisible from a page that looks finished (driver notification,
      confirmation, double-cancel)? and what do the four boundaries -
      environment, data, authority, verification - actually answer for this
      specific task, traced start to finish?
      (4) an admin dashboard that grew from a weekend hack - its CSV export,
      its login flow, a subscription-cancellation webhook handler
      [worked inventory] - asks, per feature: has this
      specific piece crossed the users/money/secrets/durable-data line from
      experiment into system, and when?
      (5) an internal support-ticket agent that reads the company wiki and
      drafts customer responses pending review [worked example] - asks:
      how do the four governance boundaries (environment, trust, data,
      apprenticeship) apply to one concrete, currently-plausible agent
      surface?
      (6) a five-agent production pipeline (planning, retrieval,
      implementation, testing, deployment agents) and, within it, a
      refund-issuing tool call [worked example] - asks: how do
      role/handoff/failure-domain contracts and a permission/idempotency
      contract actually get specified across a multi-agent system rather than
      a single coding agent?
      None of these six reuses a reserved example below; none is reserved for
      future use elsewhere, since each is scoped tightly enough to its own
      teaching point that reuse would likely mean re-litigating the same
      scenario rather than asking it something new.
