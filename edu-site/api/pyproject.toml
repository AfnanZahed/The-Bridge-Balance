[project]
name = "bridge-balance-api"
version = "0.1.0"
description = "The Bridge Balance — FastAPI backend (RAG chat, product API, auth)."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "qdrant-client>=1.16.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

# Heavy chat/RAG libraries. Imported lazily on the chat and ingest paths only, so the
# app still boots and /health passes with LLM_PROVIDER=none and without this extra
# installed. Pins are `~=` against the versions verified on 2026-09-23 (see
# specs/012-chatbot-tutor/progress.md, step 0.6).
chat = [
  "openai-agents~=0.22.3",
  "llama-index-core~=0.14.25",
  "llama-index-vector-stores-qdrant~=0.10.3",
  "llama-index-embeddings-fastembed~=0.7.0",
  "fastembed~=0.8.1",
  "qdrant-client~=1.19.1",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "tzdata~=2026.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
