<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <title>Node mesh background (pink)</title>
  <defs>
    <linearGradient id="s4-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf2f8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="s4-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="s4-mesh" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <g stroke="#ec4899" stroke-opacity="0.18" stroke-width="0.8" fill="none">
        <line x1="0" y1="0" x2="120" y2="120"/>
        <line x1="120" y1="0" x2="0" y2="120"/>
        <line x1="0" y1="60" x2="120" y2="60"/>
        <line x1="60" y1="0" x2="60" y2="120"/>
      </g>
      <g fill="#ec4899" fill-opacity="0.4">
        <circle cx="0" cy="0" r="2"/>
        <circle cx="120" cy="0" r="2"/>
        <circle cx="0" cy="120" r="2"/>
        <circle cx="120" cy="120" r="2"/>
        <circle cx="60" cy="60" r="1.5"/>
      </g>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#s4-bg)"/>
  <rect width="1600" height="900" fill="url(#s4-mesh)"/>
  <ellipse cx="1100" cy="320" rx="320" ry="220" fill="url(#s4-glow)"/>
  <ellipse cx="500" cy="600" rx="280" ry="200" fill="url(#s4-glow)"/>
  <g stroke="#ec4899" stroke-opacity="0.45" stroke-width="1.4" fill="none">
    <line x1="280" y1="240" x2="500" y2="450"/>
    <line x1="500" y1="450" x2="780" y2="220"/>
    <line x1="780" y1="220" x2="1100" y2="380"/>
    <line x1="1100" y1="380" x2="1320" y2="240"/>
    <line x1="500" y1="450" x2="380" y2="680"/>
    <line x1="380" y1="680" x2="700" y2="780"/>
    <line x1="700" y1="780" x2="980" y2="700"/>
    <line x1="980" y1="700" x2="1100" y2="380"/>
    <line x1="780" y1="220" x2="980" y2="700"/>
    <line x1="500" y1="450" x2="980" y2="700"/>
  </g>
  <g fill="#ec4899">
    <g transform="translate(500 450)">
      <circle r="14" fill-opacity="0.95"/>
      <circle r="22" fill="none" stroke="#ec4899" stroke-opacity="0.35" stroke-width="1.4"/>
    </g>
    <g transform="translate(780 220)">
      <circle r="9" fill-opacity="0.95"/>
      <circle r="16" fill="none" stroke="#ec4899" stroke-opacity="0.35" stroke-width="1.2"/>
    </g>
    <g transform="translate(1100 380)">
      <circle r="11" fill-opacity="0.95"/>
      <circle r="18" fill="none" stroke="#ec4899" stroke-opacity="0.35" stroke-width="1.2"/>
    </g>
    <g transform="translate(980 700)">
      <circle r="8" fill-opacity="0.95"/>
      <circle r="14" fill="none" stroke="#ec4899" stroke-opacity="0.35" stroke-width="1.2"/>
    </g>
    <g transform="translate(280 240)">
      <circle r="6" fill-opacity="0.7"/>
    </g>
    <g transform="translate(1320 240)">
      <circle r="6" fill-opacity="0.7"/>
    </g>
    <g transform="translate(380 680)">
      <circle r="6" fill-opacity="0.7"/>
    </g>
    <g transform="translate(700 780)">
      <circle r="6" fill-opacity="0.7"/>
    </g>
  </g>
  <g fill="#ec4899" fill-opacity="0.45">
    <circle cx="160" cy="500" r="2"/>
    <circle cx="200" cy="780" r="1.5"/>
    <circle cx="1440" cy="500" r="2"/>
    <circle cx="1420" cy="780" r="1.5"/>
    <circle cx="800" cy="120" r="2"/>
    <circle cx="800" cy="820" r="2"/>
  </g>
</svg>
