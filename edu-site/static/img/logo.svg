<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" role="img" aria-label="The Bridge Balance">
  <title>The Bridge Balance</title>
  <defs>
    <linearGradient id="tbbTile" x1="1" y1="0" x2="31" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#45484b"/>
      <stop offset=".52" stop-color="#0a0b0d"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="tbbSheen" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset=".62" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#tbbTile)"/>
  <rect width="32" height="32" rx="8" fill="url(#tbbSheen)"/>

  <!-- A tied arch: the deck stays level while the span crosses it and meets at the crown -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
    <path d="M3.6 17H28.4"/>
    <path d="M7 22.5Q11.5 11 16 11"/>
    <path d="M25 22.5Q20.5 11 16 11"/>
  </g>

  <!-- The keystone: the balance point that closes the span -->
  <circle cx="16" cy="11" r="2.1" fill="#95999d"/>

  <rect x=".6" y=".6" width="30.8" height="30.8" rx="7.4" fill="none" stroke="#ffffff" stroke-opacity=".16"/>
</svg>
