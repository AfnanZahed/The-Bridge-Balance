<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Orbital gear loop">
  <title>Orbital gear loop</title>
  <desc>Agent feedback loop: orbital motion with gear and circular arrow representing iteration.</desc>
  <defs>
    <linearGradient id="s3-bg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="s3-stroke" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="s3-orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <radialGradient id="s3-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </radialGradient>
    <radialGradient id="s3-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="s3-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#a855f7" stroke-opacity="0.10" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- background card -->
  <rect x="0" y="0" width="400" height="300" rx="14" fill="url(#s3-bg)"/>
  <rect x="0" y="0" width="400" height="300" rx="14" fill="url(#s3-grid)"/>

  <!-- soft halo -->
  <circle cx="200" cy="150" r="118" fill="url(#s3-halo)"/>

  <!-- outer orbit ring (track) -->
  <circle cx="200" cy="150" r="100" fill="none" stroke="#a855f7" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="200" cy="150" r="78" fill="none" stroke="#a855f7" stroke-opacity="0.32" stroke-width="1" stroke-dasharray="4 5"/>
  <circle cx="200" cy="150" r="56" fill="none" stroke="#a855f7" stroke-opacity="0.28" stroke-width="1"/>

  <!-- main circular loop arrow (3/4 turn) -->
  <g transform="translate(200 150)">
    <!-- arc from 12 o'clock around to ~10 o'clock -->
    <path d="M0,-100 A100,100 0 1,1 -90.5,-43.4"
          fill="none" stroke="url(#s3-orbit)" stroke-width="3.2" stroke-linecap="round"/>
    <!-- arrowhead at end of arc -->
    <path d="M-90.5,-43.4 L-100,-30 L-78,-30 Z" fill="#7e22ce"/>
    <!-- arrowhead at start (12 o'clock) -->
    <path d="M0,-100 L-9,-90 L9,-90 Z" fill="#a855f7"/>
  </g>

  <!-- inner gear (centerpiece) -->
  <g transform="translate(200 150)">
    <!-- 8-tooth gear -->
    <g fill="url(#s3-core)" stroke="#7e22ce" stroke-width="1.6" stroke-linejoin="round">
      <path d="M0,-32 L7,-30 L10,-22 L18,-22 L18,-14 L25,-9 L22,0 L25,9 L18,14 L18,22 L10,22 L7,30 L0,32 L-7,30 L-10,22 L-18,22 L-18,14 L-25,9 L-22,0 L-25,-9 L-18,-14 L-18,-22 L-10,-22 L-7,-30 Z"/>
    </g>
    <!-- gear hub -->
    <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#7e22ce" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="4" fill="#7e22ce"/>
  </g>

  <!-- orbiting satellite nodes (representing iterative steps) -->
  <g>
    <!-- node on outer orbit, top-right -->
    <g transform="translate(270 150)">
      <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="url(#s3-stroke)" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="3" fill="#a855f7"/>
    </g>
    <!-- node on middle orbit, lower-left -->
    <g transform="translate(147 196)">
      <circle cx="0" cy="0" r="6" fill="#ffffff" stroke="url(#s3-stroke)" stroke-width="1.6"/>
      <circle cx="0" cy="0" r="2" fill="#a855f7"/>
    </g>
    <!-- node on middle orbit, upper-left -->
    <g transform="translate(135 110)">
      <circle cx="0" cy="0" r="5" fill="#ffffff" stroke="url(#s3-stroke)" stroke-width="1.4"/>
      <circle cx="0" cy="0" r="1.6" fill="#a855f7"/>
    </g>
    <!-- node on inner orbit, right -->
    <g transform="translate(256 150)">
      <circle cx="0" cy="0" r="5" fill="#ffffff" stroke="url(#s3-stroke)" stroke-width="1.4"/>
      <circle cx="0" cy="0" r="1.6" fill="#a855f7"/>
    </g>
  </g>

  <!-- dotted connections (iteration paths) -->
  <g stroke="#a855f7" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="2 3" fill="none">
    <path d="M270 150 Q260 175 200 150"/>
    <path d="M200 150 Q175 180 147 196"/>
    <path d="M147 196 Q130 160 135 110"/>
    <path d="M135 110 Q170 130 200 150"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#a855f7" stroke-width="1.4" stroke-linecap="round" fill="none" stroke-opacity="0.5">
    <path d="M30 30 L30 50 M30 30 L50 30"/>
    <path d="M370 30 L370 50 M370 30 L350 30"/>
    <path d="M30 270 L30 250 M30 270 L50 270"/>
    <path d="M370 270 L370 250 M370 270 L350 270"/>
  </g>
</svg>
