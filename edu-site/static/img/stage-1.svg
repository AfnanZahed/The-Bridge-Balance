<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Layered foundation grid">
  <title>Layered foundation grid</title>
  <desc>Architectural blueprint: layered foundation grid representing structural scaffolding.</desc>
  <defs>
    <linearGradient id="s1-bg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="s1-stroke" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="s1-fill" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="s1-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#06b6d4" stroke-opacity="0.12" stroke-width="0.6"/>
    </pattern>
    <pattern id="s1-grid-major" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#06b6d4" stroke-opacity="0.22" stroke-width="0.9"/>
    </pattern>
  </defs>

  <!-- background card -->
  <rect x="0" y="0" width="400" height="300" rx="14" fill="url(#s1-bg)"/>
  <rect x="0" y="0" width="400" height="300" rx="14" fill="url(#s1-grid)"/>
  <rect x="0" y="0" width="400" height="300" rx="14" fill="url(#s1-grid-major)"/>

  <!-- blueprint frame -->
  <rect x="24" y="24" width="352" height="252" rx="8" fill="none" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="1"/>

  <!-- corner ticks (registration marks) -->
  <g stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round">
    <line x1="24" y1="44" x2="44" y2="44"/>
    <line x1="44" y1="24" x2="44" y2="44"/>
    <line x1="376" y1="44" x2="356" y2="44"/>
    <line x1="356" y1="24" x2="356" y2="44"/>
    <line x1="24" y1="256" x2="44" y2="256"/>
    <line x1="44" y1="276" x2="44" y2="256"/>
    <line x1="376" y1="256" x2="356" y2="256"/>
    <line x1="356" y1="276" x2="356" y2="256"/>
  </g>

  <!-- horizontal section guides (dashed) -->
  <g stroke="#06b6d4" stroke-opacity="0.25" stroke-width="0.8" stroke-dasharray="3 4" fill="none">
    <line x1="60" y1="80" x2="340" y2="80"/>
    <line x1="60" y1="130" x2="340" y2="130"/>
    <line x1="60" y1="180" x2="340" y2="180"/>
    <line x1="60" y1="230" x2="340" y2="230"/>
  </g>

  <!-- dimension annotations -->
  <g font-family="Inter, system-ui, sans-serif" font-size="9" fill="#0891b2" fill-opacity="0.7" font-feature-settings="tnum">
    <text x="70" y="74">A</text>
    <text x="170" y="74">B</text>
    <text x="270" y="74">C</text>
    <text x="316" y="74">D</text>
  </g>

  <!-- layered foundation: 3 stacked slabs -->
  <g>
    <!-- slab 3 (top) -->
    <rect x="120" y="120" width="160" height="30" rx="3" fill="url(#s1-fill)" stroke="url(#s1-stroke)" stroke-width="1.6"/>
    <line x1="135" y1="135" x2="265" y2="135" stroke="#06b6d4" stroke-opacity="0.55" stroke-width="0.8"/>

    <!-- slab 2 (middle) — wider -->
    <rect x="100" y="160" width="200" height="30" rx="3" fill="url(#s1-fill)" stroke="url(#s1-stroke)" stroke-width="1.6"/>
    <line x1="115" y1="175" x2="285" y2="175" stroke="#06b6d4" stroke-opacity="0.55" stroke-width="0.8"/>

    <!-- slab 1 (base) — widest -->
    <rect x="80" y="200" width="240" height="30" rx="3" fill="url(#s1-fill)" stroke="url(#s1-stroke)" stroke-width="1.6"/>
    <line x1="95" y1="215" x2="305" y2="215" stroke="#06b6d4" stroke-opacity="0.55" stroke-width="0.8"/>
  </g>

  <!-- vertical load column connecting slabs -->
  <g stroke="#06b6d4" stroke-opacity="0.5" stroke-width="0.9" stroke-dasharray="2 3">
    <line x1="200" y1="100" x2="200" y2="120"/>
    <line x1="200" y1="150" x2="200" y2="160"/>
    <line x1="200" y1="190" x2="200" y2="200"/>
  </g>

  <!-- center node at apex -->
  <circle cx="200" cy="100" r="6" fill="#ffffff" stroke="#06b6d4" stroke-width="2"/>
  <circle cx="200" cy="100" r="2.5" fill="#0891b2"/>

  <!-- side markers -->
  <g fill="#06b6d4" fill-opacity="0.45">
    <circle cx="80" cy="135" r="2"/>
    <circle cx="320" cy="135" r="2"/>
    <circle cx="80" cy="175" r="2"/>
    <circle cx="320" cy="175" r="2"/>
  </g>
</svg>
