<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <title>Orbital background (violet)</title>
  <defs>
    <linearGradient id="s3-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f3ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="s3-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="s3-grid" x="0" y="0" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#a855f7" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#s3-bg)"/>
  <rect width="1600" height="900" fill="url(#s3-grid)"/>
  <g>
    <g transform="translate(800 450)">
      <circle r="320" fill="url(#s3-halo)"/>
      <circle r="280" fill="none" stroke="#a855f7" stroke-opacity="0.18" stroke-width="1"/>
      <circle r="220" fill="none" stroke="#a855f7" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="5 6"/>
      <circle r="160" fill="none" stroke="#a855f7" stroke-opacity="0.22" stroke-width="1"/>
      <circle r="100" fill="none" stroke="#a855f7" stroke-opacity="0.32" stroke-width="1.2"/>
      <ellipse rx="280" ry="80" fill="none" stroke="#a855f7" stroke-opacity="0.34" stroke-width="1.4" transform="rotate(20)"/>
      <ellipse rx="280" ry="80" fill="none" stroke="#a855f7" stroke-opacity="0.18" stroke-width="1" transform="rotate(-35)"/>
    </g>
    <g stroke="#a855f7" stroke-opacity="0.55" stroke-width="1.4" fill="#a855f7" fill-opacity="0.25">
      <circle cx="800" cy="170" r="6"/>
      <circle cx="800" cy="730" r="5"/>
      <circle cx="520" cy="450" r="5"/>
      <circle cx="1080" cy="450" r="5"/>
    </g>
    <g fill="#a855f7" fill-opacity="0.4">
      <circle cx="200" cy="180" r="2"/>
      <circle cx="280" cy="260" r="1.5"/>
      <circle cx="1400" cy="220" r="2"/>
      <circle cx="1320" cy="320" r="1.5"/>
      <circle cx="240" cy="700" r="2"/>
      <circle cx="1380" cy="720" r="2"/>
    </g>
  </g>
  <g stroke="#a855f7" stroke-opacity="0.28" stroke-width="1" stroke-linecap="round" fill="none">
    <path d="M200 180 L 280 260"/>
    <path d="M1320 320 L 1400 220"/>
    <path d="M240 700 L 380 660"/>
    <path d="M1220 660 L 1380 720"/>
  </g>
</svg>
