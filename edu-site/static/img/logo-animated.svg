<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" role="img" aria-label="The Bridge Balance">
  <title>The Bridge Balance</title>
  <!--
    Animated variant for static hosts (README, docs, email signature).
    Motion: the deck draws, the two halves of the tied arch climb to the crown, the
    keystone drops in, then a slow hue drift breathes across the tile.
    All motion collapses to the finished mark under prefers-reduced-motion.
  -->
  <defs>
    <linearGradient id="tbbATile" x1="1" y1="0" x2="31" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d5cff"/>
      <stop offset=".52" stop-color="#5b4cf6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="tbbATileAlt" x1="31" y1="0" x2="1" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset=".58" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="tbbASheen" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset=".62" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .drift { animation: tbbDrift 9s ease-in-out 1s infinite; }
    .span  { stroke-dasharray: 100; stroke-dashoffset: 100; animation: tbbDraw 620ms cubic-bezier(.16,1,.3,1) forwards; }
    .span-l { animation-delay: 90ms; }
    .span-r { animation-delay: 170ms; }
    .key    { transform-box: fill-box; transform-origin: center; opacity: 0;
              animation: tbbKey 420ms cubic-bezier(.34,1.4,.5,1) 620ms forwards; }
    .halo   { transform-box: fill-box; transform-origin: center; opacity: 0;
              animation: tbbHalo 3.6s cubic-bezier(.16,1,.3,1) 1.1s infinite; }

    @keyframes tbbDraw  { to { stroke-dashoffset: 0; } }
    @keyframes tbbKey   { from { opacity: 0; transform: translateY(2px) scale(.4); }
                          to   { opacity: 1; transform: none; } }
    @keyframes tbbHalo  { 0% { transform: scale(.7); opacity: .4; }
                          70%, 100% { transform: scale(2.1); opacity: 0; } }
    @keyframes tbbDrift { 0%, 100% { opacity: 0; } 50% { opacity: .5; } }

    @media (prefers-reduced-motion: reduce) {
      .drift { animation: none; opacity: .16; }
      .span  { animation: none; stroke-dashoffset: 0; }
      .key   { animation: none; opacity: 1; }
      .halo  { animation: none; opacity: 0; }
    }
  </style>

  <rect width="32" height="32" rx="8" fill="url(#tbbATile)"/>
  <rect class="drift" width="32" height="32" rx="8" fill="url(#tbbATileAlt)" opacity="0"/>
  <rect width="32" height="32" rx="8" fill="url(#tbbASheen)"/>

  <circle class="halo" cx="16" cy="11" r="2.1" fill="#ff7849"/>

  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
    <path class="span"        pathLength="100" d="M3.6 17H28.4"/>
    <path class="span span-l" pathLength="100" d="M7 22.5Q11.5 11 16 11"/>
    <path class="span span-r" pathLength="100" d="M25 22.5Q20.5 11 16 11"/>
  </g>

  <circle class="key" cx="16" cy="11" r="2.1" fill="#ff7849"/>

  <rect x=".6" y=".6" width="30.8" height="30.8" rx="7.4" fill="none" stroke="#ffffff" stroke-opacity=".16"/>
</svg>
